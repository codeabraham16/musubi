# musubi-alerts-flota.yml — las alertas del track «Control de flota».
#
# despliegue: condicional — sólo si el cerebro expone `musubi_fleet_*`.
#
# Sin plano de flota, `FlotaSinTelemetria` es `absent(...)` y dispara desde el día uno, para
# siempre.
#
# La lee `deploy/verificar-despliegue.sh` para no denunciar como drift un archivo que está sin
# cargar a propósito.
#
# ────────────────────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESTÁN EN UN ARCHIVO APARTE
#
# Estas reglas miran métricas que sólo existen si el cerebro desplegado TIENE el plano de flota.
# Cargarlas contra un cerebro que no lo tiene no es inocuo: `FlotaSinTelemetria` es
# `absent(musubi_fleet_device_up)`, así que **dispara de inmediato y para siempre** — una alarma
# falsa desde el día uno, que es exactamente lo que enseña a ignorar las alarmas.
#
# `preparar.sh` le pregunta al cerebro si expone `musubi_fleet_*` y sólo instala este archivo si
# la respuesta es sí. Si no, lo deja al lado con otro nombre y lo dice. La regla no está mal: le
# falta su precondición, y esa distinción tiene que ser visible.
# ────────────────────────────────────────────────────────────────────────────────────────────

groups:
  # ════════════════════════════════════════════════════════════════════════════════════════
  # UNA MÁQUINA CAÍDA NO ES UNA MÁQUINA CON LA CPU AL 100 %
  #
  # Prometheus conserva la última muestra de una serie hasta que caduca. Cuando un agente muere,
  # sus series NO desaparecen: se CONGELAN. Y una comparación sobre un valor congelado se sostiene
  # para siempre, así que el `for:` —que exige que la condición dure— la confirma en vez de
  # filtrarla.
  #
  # MEDIDO EN PRODUCCIÓN el 2026-09-02: `davantis-1` se cayó y el tablero mostró TRES alertas para
  # un solo evento — `MaquinaCaida` (verdadera), más `CPUSostenida` y `MaquinaLateSinMedir`
  # disparando sobre la última muestra que llegó antes de morir. Dos de las tres describían una
  # máquina que no estaba.
  #
  # Por eso toda regla que lea una serie de la MUESTRA (o de los servicios) lleva:
  #
  #     unless on(project, device) (musubi_fleet_device_up == 0)
  #
  # EL JOIN LLEVA `project` Y NO SÓLO `device` (Ola 1 del plan empresa, 2026-09-03).
  #
  # Con un solo tenant las dos formas se comportan igual, y por eso el error es invisible HOY: el
  # día que dos clientes tengan cada uno un `srv-01`, `on(device)` empareja muchos-con-muchos y
  # Prometheus NO evalúa la regla — la descarta entera con un error. O sea que `MaquinaCaida`
  # dejaría de vigilar A TODA LA FLOTA, no sólo a esas dos máquinas, y el síntoma sería silencio.
  #
  # `project` está en las cuatro etiquetas de toda serie de flota (device, project, tier, os), así
  # que ponerlo no cuesta nada hoy y evita el modo de falla más caro de mañana. Lo custodia
  # `TestNingunJoinDeFlotaEmparejaSoloPorDevice`.
  #
  # El patrón ya existía —`ServicioCaido` lo usaba desde S12— y estaba aplicado en 3 de 14 reglas.
  # Lo custodia `TestNingunaAlertaDeMuestraDisparaSobreUnaMaquinaCaida`, así que la regla número 15
  # no puede nacer sin él.
  #
  # LO QUE ESTO **NO** SILENCIA, y es la razón de que sea `unless` y no un `and up == 1`:
  # `MaquinaCaida` y `FlotaSinTelemetria` siguen intactas. No se pierde el aviso — se pierde el
  # eco. Y `MaquinaLateSinMedir` recupera su significado literal: «late PERO dejó de medir», que
  # de una máquina que no late no se puede afirmar.
  #
  # EL CASO INCÓMODO, dicho para que nadie lo redescubra: si una máquina se cae PORQUE se le llenó
  # el disco, `DiscoPorLlenarse` deja de sonar y sólo queda `MaquinaCaida`. Se aceptó a sabiendas:
  # sobre una máquina que no está no se puede accionar nada, el dato sigue en Prometheus, y el
  # runbook de `MaquinaCaida` manda a mirar la última muestra. Un aviso que no se puede atender
  # sólo entrena a ignorar el canal.
  # ════════════════════════════════════════════════════════════════════════════════════════
  - name: musubi-flota
    rules:
      # --- La máquina dejó de latir ---
      # up == 0 lo deriva el cerebro con su propio umbral (90s = 3 latidos), así que esto no
      # duplica el criterio: lo reexporta.
      # `up == 0` DECÍA DOS COSAS DISTINTAS Y MANDABA AL LUGAR EQUIVOCADO (Ola 3).
      #
      # Vale 0 cuando la máquina está apagada **y también** cuando la máquina está perfecta y el
      # agente no está corriendo. Son dos problemas, se arreglan en dos lugares, y esta alerta
      # disparaba igual para los dos: mandaba a revisar el hardware de una máquina encendida.
      #
      # Ya costó caro dos veces. `gio` figuró caída TRES DÍAS respondiendo al ping en 145 ms: el
      # agente arranca al iniciar sesión y nadie había iniciado sesión. Y el 2026-09-04, en plena
      # investigación de quince cortes de energía en `davantis-1`, la máquina estaba ENCENDIDA
      # —`tailscale ping` contestaba en 55 ms— y lo único muerto era el agente.
      #
      # `musubi_fleet_net_up` lo contesta: el cerebro le pregunta al tailnet por las
      # máquinas que NO están latiendo. Las dos reglas son MUTUAMENTE EXCLUYENTES por
      # construcción —`unless` y `and` sobre la misma condición—, así que no hace falta ninguna
      # inhibición entre ellas y nunca llegan las dos.
      #
      # SI LA SERIE FALTA, `unless` no quita nada y esta alerta se comporta EXACTAMENTE como
      # antes. Es la propiedad que hace seguro el cambio: donde no se puede medir —un cerebro sin
      # tailnet, una máquina que no está en él— el eje se apaga solo en vez de callar la alerta.
      - alert: MaquinaCaida
        # LA VENTANA DE MANTENIMIENTO TIENE QUE CALLAR ESTA, Y ERA LA QUE NO LA MIRABA.
        #
        # `musubi_fleet_maintenance` se describe con este caso EXACTO como su razón de ser: «sin
        # esto, un reinicio planificado dispara servicio_caido». Un reinicio planificado es el
        # motivo más común para declarar una ventana — y `MaquinaCaida` disparaba a los cinco
        # minutos igual, o sea que la ventana no hacía lo que su propio texto promete.
        #
        # Medido el 2026-09-05 sobre las 23 reglas del archivo: 18 llevaban la guarda y 5 no, y
        # `MaquinaLateSinMedir` —la vecina, misma familia— sí la lleva. La intención estaba clara y
        # aplicada de a pedazos. Ver A97.
        #
        # EL COSTO ESTÁ ASUMIDO Y DICHO: durante la ventana, una máquina que se muere de verdad no
        # avisa. Es el trato de cualquier ventana de mantenimiento, dura como máximo 24 h, se
        # declara con motivo y queda en la cronología. Las otras 18 reglas ya lo aceptaban.
        expr: >-
          musubi_fleet_device_up == 0
          unless on(project, device) musubi_fleet_net_up == 1
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "No late hace más de 5 minutos, y el cerebro tampoco la alcanza por la red."
          nota: "La máquina no está: apagada, sin red, o revocada (musubi_fleet_list --include_revoked). Si el cerebro NO puede consultar el tailnet, esta alerta también aparece sin haber podido comprobarlo — su ausencia de `musubi_fleet_net_up` lo dice. Ver deploy/RUNBOOK.md#maquinacaida-en-un-equipo-windows-mir-esto-primero"

      # --- La máquina está viva y el agente no ---
      - alert: AgenteCaidoConMaquinaViva
        # Igual que su gemela de arriba, y acá el caso es todavía más directo: actualizar el agente
        # es una actividad de mantenimiento, y el agente PARA mientras la máquina sigue en la red —
        # que es literalmente la condición de esta regla. El 2026-09-05 se actualizó el agente en
        # dos Windows y esto era lo que iba a sonar.
        expr: >-
          musubi_fleet_device_up == 0
          and on(project, device) musubi_fleet_net_up == 1
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El agente no late, pero la máquina SÍ está en la red: lo caído es el agente."
          nota: "No mires el hardware. En Windows la tarea programada arranca AL INICIAR SESIÓN: si la máquina reinició y nadie entró, el agente no corre. `Get-ScheduledTask 'Musubi Agente de Flota' | Get-ScheduledTaskInfo` lo dice, y `deploy/diagnostico-cortes-windows.ps1` lo trae junto con todo lo demás. Ver deploy/RUNBOOK.md#agentecaidoconmaquinaviva"

      # --- La máquina se REINICIÓ ---
      #
      # ESTA REGLA NACIÓ DE UN AGUJERO MEDIDO (A79), Y SU PRIMERA VERSIÓN ESTABA MAL.
      #
      # El 2026-09-03, persiguiendo por qué `davantis-1` se había caído, el registro de eventos de
      # Windows mostró TRECE apagones sucios en diez días —evento 41, doce con `BugcheckCode=0`, o
      # sea sin pantalla azul: a la máquina la cortaron—. La flota los vio todos y no dijo nada:
      # `musubi_fleet_device_uptime_seconds` se exportaba desde el principio y NINGUNA de las 22
      # reglas lo miraba.
      #
      # Lo peor no era que faltara la alerta: `MaquinaCaida` SÍ disparó cada vez y se apagó sola a
      # los pocos minutos, cuando la máquina volvía. Trece avisos que aparecen y se resuelven solos
      # se leen como ruido de red, no como «esta PC se está cayendo».
      #
      # ────────────────────────────────────────────────────────────────────────────────────────
      # POR QUÉ NO ES `resets(...[24h]) >= 2`, QUE ES LO QUE ESCRIBÍ PRIMERO
      #
      # Porque se midió antes de desplegarla y NO HABRÍA DISPARADO NI UNA VEZ. Sobre los datos
      # reales de `davantis-1`, `resets(uptime[24h])` tocó un máximo de **1** en diez días: 0 de
      # 69 horas llegaron a 2. Los dos reinicios que Prometheus tiene guardados están a **44 horas**
      # uno del otro (08-31 21:41 y 09-02 17:26), así que ninguna ventana de 24 h contiene dos.
      #
      # Contar es lo correcto conceptualmente y lo que el dato no sostiene: para que una ventana de
      # 24 h vea el patrón, los cortes tienen que caer juntos, y acá caen espaciados. Agrandar la
      # ventana tampoco: el TSDB de este Prometheus **arranca el 2026-08-31 17:44** —perdió su
      # historia ese día, con retención declarada de 90 d—, así que un `[7d]` mide tres días y
      # miente sobre los otros cuatro.
      #
      # Lo que el dato SÍ sostiene es la caída del uptime, y se ve limpia: 39,4 h → 0,41 h, y
      # 37,9 h → 0,14 h. Sin huecos: el agente sobrevive al reinicio y reporta el arranque nuevo.
      # Así que la regla dispara por ARRANQUE RECIENTE, una vez por reinicio, y el patrón se lee
      # en el historial de la alerta en vez de en una ventana que no alcanza. **Contar sigue siendo
      # mejor y el runbook dice cómo hacerlo a mano**; lo que no se puede es fingir que la ventana
      # de 24 h lo hace.
      #
      # LLEVA LA GUARDA, y acá no es cosmética: una máquina que se muere JUSTO DESPUÉS de arrancar
      # congela su uptime en un valor chico, y sin la guarda esta comparación se sostendría para
      # siempre sobre un número que ya no se mueve. Es exactamente la trampa de las series
      # congeladas, con la vuelta de tuerca de que acá el umbral es un piso y no un techo.
      - alert: MaquinaSeReinicio
        expr: >-
          (musubi_fleet_device_uptime_seconds < 1800)
            unless on(project, device) (musubi_fleet_device_up == 0)
            unless on(project, device) (musubi_fleet_device_maintenance == 1)
        # Sin `for`: el evento dura lo que dura el arranque, y esperar cinco minutos para avisar de
        # algo que pasó hace tres es perder la mitad de la ventana. El techo de 1800 s ya es la
        # ventana: el aviso vive media hora y se apaga solo.
        labels:
          severity: warning
        annotations:
          summary: "Arrancó hace {{ $value | humanizeDuration }}: se reinició."
          description: >-
            Un reinicio que la flota vio. Si nadie lo pidió, la causa está afuera del sistema
            operativo mucho más seguido que adentro. El runbook trae cómo distinguirlo en dos
            comandos, y cómo contar los anteriores.
          runbook: "deploy/RUNBOOK.md#maquinasereinicio"
          # `altura-db` late con su token (es un Tier B SIN shell: address vacío), y el guion que
          # arma esa muestra no llena `uptime_seg`. Cero es el centinela de «no medido», así que la
          # serie no existe. NO es un límite de la plataforma —`/proc/uptime` está ahí— sino de ese
          # empujador en particular; queda anotado en A80 para que la excusa no se vuelva eterna.
          ausente_en: "tier=B — altura-db empuja su propia muestra y ese guion no manda uptime_seg; el 0 se lee «no medido» y la serie no existe. Arreglable, no estructural: ver A80."

      # --- El agente late pero dejó de MEDIR ---
      # Es el fallo silencioso que un `up` no detecta: el proceso vive, el colector murió. Sin
      # esta regla, el panel muestra la última muestra buena para siempre y parece sana.
      - alert: MaquinaLateSinMedir
        expr: (musubi_fleet_device_sample_age_seconds > 600) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Late, pero su última muestra tiene {{ $value | humanizeDuration }}."
          nota: "El agente vive y el colector no. Mirá su salida: puede ser un OS sin colector, o /proc inaccesible."

      # --- Disco ---
      # Se alerta sobre AVAILABLE, no sobre usado. No es lo mismo: el kernel reserva ~5% para
      # root, así que un disco "al 92% usado" puede tener 0 bytes escribibles para una aplicación.
      - alert: DiscoPorLlenarse
        # EL UMBRAL SUBIÓ DE 0.10 A 0.15 AL ABSORBER LA ALERTA DE `alerter.py` (A33).
        #
        # No fue un ajuste de gusto: al ir a apagar la regla duplicada resultó que NO era la
        # misma. `alerter.py` avisaba al 85 % usado; ésta, con 0.10, recién al 90 %. Apagar la
        # vieja sin mirar habría bajado la sensibilidad cinco puntos sin que nadie lo notara —
        # exactamente la clase de pérdida silenciosa que una "limpieza de duplicados" produce.
        #
        # Medido al decidirlo: `kernelos-pc` (hoy `davantis-1`) estaba al 86,6 % usado, o sea en la
        # zona ciega entre los dos umbrales. Con 0.15 esa máquina alerta, y tiene que alertar.
        expr: (musubi_fleet_device_disk_available_bytes / musubi_fleet_device_disk_total_bytes < 0.15) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 15m
        # `sintoma` EMPAREJA ESTA ALERTA CON SU ESCALÓN CRÍTICO, y no es decorativo: la inhibición
        # «lo crítico calla a lo warning» de alertmanager.yml usa ESTA etiqueta y no `alertname`,
        # porque los dos escalones de un mismo síntoma se llaman distinto por definición. Con
        # `equal: ['alertname', ...]` no podía casar nunca — ver el comentario de esa regla.
        labels: { severity: warning, sintoma: disco }
        annotations:
          summary: "Queda {{ $value | humanizePercentage }} de disco escribible."
          nota: "OJO: es espacio DISPONIBLE, no 'no usado'. La reserva de root no cuenta."

      - alert: DiscoCasiLleno
        expr: (musubi_fleet_device_disk_available_bytes / musubi_fleet_device_disk_total_bytes < 0.03) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 5m
        labels: { severity: critical, sintoma: disco }
        annotations:
          summary: "Queda {{ $value | humanizePercentage }} de disco escribible."

      # --- Memoria y CPU sostenidas ---
      # `for` largo a propósito: un pico de 5 minutos es trabajo, no un incidente. Lo que importa
      # es lo sostenido.
      - alert: MemoriaSostenida
        expr: (musubi_fleet_device_memory_used_bytes / musubi_fleet_device_memory_total_bytes > 0.92) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "Lleva 20 min con la RAM al {{ $value | humanizePercentage }}."
          nota: "Usada = total - MemAvailable, así que el page cache NO cuenta: esto es presión real."

      - alert: CPUSostenida
        expr: (musubi_fleet_device_cpu_percent > 90) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Lleva 30 min con la CPU al {{ $value | printf \"%.0f\" }}%."

      # --- Carga por core ---
      # Normalizada por CPUs: una carga de 8 es normal en 12 cores y grave en 2.
      - alert: CargaPorCoreAlta
        expr: (musubi_fleet_device_load5 / musubi_fleet_device_cpus > 2) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "Carga a 5 min de {{ $value | printf \"%.1f\" }}× la cantidad de cores."
          ausente_en: "os=windows — el load average es un concepto de UNIX y ahí no existe; emitir un 0 lo haría indistinguible de una máquina ociosa."

      # --- Temperatura ---
      # Sólo dispara donde hay sensor: la serie no existe en las máquinas sin él, así que esto
      # no alerta por ausencia de dato (que es justamente lo que un 0 inventado habría hecho).
      #
      # WINDOWS YA NO ESTÁ AFUERA, DESDE EL 2026-09-05. La anotación decía «os=windows — el sensor
      # se saca por WMI y eso sigue abierto (A2)», y eso dejó de ser cierto el día que el agente
      # nuevo llegó a `davantis-1`: `colector_windows.go` lee `MSAcpi_ThermalZoneTemperature` cada
      # dos minutos y la serie existe. Un `ausente_en` que nombra un hueco que ya se tapó le dice
      # a un operador que esa máquina NO está cubierta cuando sí lo está — es la misma familia que
      # el resto del registro persigue: un texto que describe un estado anterior y se lee como el
      # actual.
      #
      # LO QUE SIGUE SIN SABERSE, y no se disfraza: la zona térmica ACPI es GRUESA (escalones de
      # 1 K; las tres primeras lecturas dieron 29,85 °C exacto) y puede ser de chasis y no de CPU,
      # que es literalmente el defecto que ya se arregló del lado de Linux. Con 85 °C de umbral,
      # un sensor de chasis NO va a disparar aunque el die esté ardiendo. O sea: la serie existe,
      # la alerta la mira, y todavía no está medido que sirva para lo que hace falta en A79.
      - alert: TemperaturaAlta
        expr: (musubi_fleet_device_temperature_celsius > 85) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A {{ $value | printf \"%.0f\" }}°C."
          ausente_en: "tier=B — un host sondeado por SSH no expone su zona térmica."

      # --- LA TRAMPA SILENCIOSA ---
      # Si el scrape pierde sus concesiones (alguien editó principals.yaml, se revocó el token),
      # TODAS las series de flota desaparecen y las alertas de arriba dejan de disparar — sin
      # que nada falle. Una alerta que se apaga sola es peor que no tenerla.
      # --- EL TECHO AVISA ANTES DE CORTAR, Y NO DESPUÉS ---
      #
      # `musubi_fleet_export_truncated` dice que un techo YA cortó: llega cuando la cobertura ya
      # se perdió, y lo que se pierde no es un gráfico — son las series de las máquinas o los
      # servicios que quedaron afuera, así que SUS alertas dejan de poder dispararse.
      #
      # Los tres techos estaban tipeados en Go y no llegaban a Prometheus, así que el margen sólo
      # se podía ver entrando a mirar. Medido el 2026-09-10: `musubi-server` declara 56 servicios
      # contra el techo de 64 del latido. Quedaban OCHO, y nadie tenía forma de saberlo.
      #
      # El 80 % da margen para actuar: subir la perilla, partir un proyecto, o declarar menos
      # servicios. Es `warning` y no `critical` porque todavía no se perdió nada.
      # --- EL CEREBRO NO PUEDE COMPARAR VERSIONES, Y ESO APAGA UN EJE ENTERO ---
      #
      # `musubi_fleet_device_agent_stale` se OMITE cuando la comparación no se puede hacer. Del
      # lado del AGENTE eso es normal (un Tier B no tiene versión que comparar). Del lado del
      # CEREBRO es un incidente: si su propia versión no se parsea —vacía porque el build no la
      # selló, o de cuatro componentes— la serie desaparece de la FLOTA ENTERA y
      # `AgenteDesactualizado` queda imposible de disparar.
      #
      # Es el incidente del 2026-09-09, del que se arregló la causa conocida y no la forma de
      # falla. `critical` porque no se ve: el tablero queda entero en verde y el eje apagado.
      - alert: CerebroSinReferenciaDeVersion
        expr: musubi_fleet_version_reference_usable == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "El cerebro no puede parsear su propia versión: NADIE vigila si los agentes están atrasados."
          nota: "`musubi_fleet_device_agent_stale` se omite para la flota entera, así que AgenteDesactualizado no puede dispararse — y el tablero queda en verde. Casi siempre es un binario construido sin los ldflags de versión (`deploy/construir.sh` los pone). Comprobalo con `musubi version` en el cerebro."

      - alert: TechoDeExportCerca
        expr: musubi_fleet_export_usage / on(kind) musubi_fleet_export_limit > 0.8
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "El export de flota va al {{ $value | humanizePercentage }} del techo de {{ $labels.kind }}."
          nota: "Cuando llegue al 100 % el exportador RECORTA, y lo que queda afuera no tiene serie: sus alertas no pueden dispararse. `kind=projects` se sube en `proyectosParaExportar` (constante de compilación, hay que recompilar); `kind=services` con la perilla `fleet.services_per_project_export`. El techo del latido (`kind=heartbeat_services`) no tiene perilla: es `fleet.ServiciosPorLatido` y una máquina que lo pase manda un inventario recortado que el cerebro lee como completo."

      - alert: FlotaSinTelemetria
        expr: absent(musubi_fleet_device_up)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "No llega NINGUNA métrica de flota POR EL EMPUJE: el resto de las alertas de flota están ciegas."
          nota: "`musubi_fleet_device_up` llega SÓLO por el empuje OTLP (prometheus.yml descarta esa familia del scrape a propósito). Así que esto apunta al empujador: `MusubiPushOTLPFallando`, `MusubiPushOTLPMudo` y `MusubiPushOTLPNuncaLlego` dicen por qué. La mitad del SCRAPE la vigila FlotaSinTelemetriaDelScrape."

      # --- Y LA OTRA MITAD, QUE ESTA ALERTA NO PODÍA VER ---
      #
      # `FlotaSinTelemetria` mira `musubi_fleet_device_up`, que por decisión de `prometheus.yml`
      # llega SÓLO por el empuje OTLP: esa familia se descarta del scrape para que no haya dos
      # productores del mismo dato. O sea que la alerta que dice «no llega NINGUNA métrica de
      # flota» era ciega a la mitad de las formas de no tenerla.
      #
      # Y SU PROPIA NOTA APUNTABA A LA MITAD QUE NO VE. Decía «revisá la sección `fleet:` del
      # principal del scrape» — que es exactamente la causa que NO puede detectar: con esa
      # concesión sacada, `/metrics` deja de traer las series de flota, el scrape sigue en `up==1`
      # (así que `MusubiDown` tampoco dice nada), y `device_up` sigue llegando por el empuje.
      # Todo verde, y la mitad del plano de flota apagada.
      #
      # `musubi_fleet_export_truncated` es el canario correcto: el exportador la emite SIEMPRE
      # —0 cuando no recortó, 1 cuando sí— y es una de las cinco series que viajan sólo por el
      # scrape, así que su ausencia no puede deberse al empujador.
      - alert: FlotaSinTelemetriaDelScrape
        expr: absent(musubi_fleet_export_truncated)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "El scrape del cerebro no trae NINGUNA métrica de flota, aunque el target esté arriba."
          nota: "Revisá la sección `fleet:` del principal del scrape en .musubi/principals.yaml. Con el target en `up==1` y esta serie ausente, la causa es de PERMISOS o de que el plano de flota no está en el binario desplegado — no del empujador. Ver deploy/prometheus/prometheus.yml."

      # --- EL AGENTE SE QUEDÓ ATRÁS (A68) ---
      #
      # Nació de un caso medido: el cerebro en 0.130.0 y los dos Windows en 0.106.0, veinticuatro
      # versiones atrás, descubierto DE CASUALIDAD mirando otra cosa. El costo fue concreto: A67 se
      # desplegó y no podía correr en las dos máquinas para las que se escribió, porque su binario
      # no tenía la capacidad — y nada lo habría dicho. Un agente atrasado se veía idéntico a uno
      # al día.
      #
      # EL `for` LARGO ES LA REGLA, NO UN AJUSTE DE GUSTO. Bumpear VERSION y redesplegar el cerebro
      # deja a la flota legítimamente atrasada hasta que alguien cruce el binario a cada máquina, y
      # eso es trabajo manual en Windows. Seis horas dejan pasar el flujo normal —bump, despliegue,
      # actualización el mismo día— y marcan lo que se quedó de verdad.
      #
      # La serie compara NÚCLEOS semver: dos commits del mismo release no son un agente atrasado.
      # Ver internal/fleet/version.go, que explica lo que esto NO puede ver.
      - alert: AgenteDesactualizado
        expr: (musubi_fleet_device_agent_stale == 1) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "Su agente corre un release distinto del cerebro."
          nota: "Cuál versión corre cada máquina sale de `musubi_fleet_list` — la versión no viaja como etiqueta a propósito. Ver deploy/RUNBOOK.md#agentedesactualizado"
          ausente_en: "tier=B — un Tier B no corre nuestro binario, así que no hay versión que comparar."


  # ── El auto-heal se vigila a sí mismo (S10 · A10) ─────────────────────────────────────────

  - name: musubi-politicas
    rules:
      # UNA POLÍTICA QUE ACTÚA Y NO CURA ES PEOR QUE NO TENER POLÍTICA.
      #
      # El auto-heal tapa el síntoma: la alerta de disco/memoria deja de dispararse porque la
      # política la baja justo a tiempo, una y otra vez, y nadie se entera de que hay un problema
      # de fondo. Un `journalctl --vacuum` cada hora durante una semana no es mantenimiento: es
      # algo que escribe log sin parar y que nadie fue a mirar.
      #
      # El umbral está atado al cooldown mínimo razonable: más de 3 acciones en 6 h significa que
      # la condición vuelve a cruzarse apenas se suelta el cooldown.
      - alert: PoliticaQueNoCura
        expr: increase(musubi_fleet_policy_actions_total{result="ok"}[6h]) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "La política {{ $labels.policy }} actuó {{ $value | printf \"%.0f\" }} veces en 6 h: está tapando el síntoma, no curándolo."
          runbook: "deploy/RUNBOOK.md#politicaquenocura"

      # UNA MÁQUINA QUE NO ALCANZA LO QUE NECESITA ALCANZAR (A67).
      #
      # Nace de un caso concreto: el relay propio se veía sano por las tres vías que existían —dos
      # contenedores arriba y sus tres puertos contestando— y NINGÚN cliente llegaba. El chequeo
      # sondeaba desde el propio servidor, que es el único lugar desde el que siempre anda.
      #
      # Esta regla mira la sonda que toma CADA MÁQUINA, así que un `0` significa «desde acá no se
      # llega». La causa puede ser el destino caído o la red de esa máquina —un VPN que se come la
      # ruta fue la real— y por eso el summary nombra la máquina y no el destino: quien atiende
      # tiene que ir a mirar ESA máquina.
      #
      # AUSENTE NO DISPARA: una máquina sin destinos configurados no emite la serie, así que no
      # entra acá. Si emitiera 0, toda la flota sin configurar sonaría desde el día uno — que es
      # exactamente cómo se le enseña a alguien a ignorar las alarmas.
      - alert: MaquinaQueNoAlcanzaSuDestino
        expr: (musubi_fleet_device_reach_up == 0) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "No alcanza alguno de los destinos que le declararon. Cuál, en `no_alcanza` de musubi_fleet_list."
          nota: "El destino puede estar caído, o la red de ESA máquina puede estar cortando la ruta (un VPN con todo el tráfico capturado es la causa más común)."
          runbook: "deploy/RUNBOOK.md#maquinaquenoalcanzasudestino"
          ausente_en: "sin-declarar — la sonda mira los destinos de MUSUBI_ALCANCE y es opt-in por máquina (A67): nadie le pidió que mirara no es lo mismo que no llega."

      # La política está viva pero NO PUEDE actuar: su principal perdió la concesión `exec`, o el
      # comando dejó de estar en su allowlist. Es una alarma apagada, y una alarma apagada en
      # silencio es la razón por la que existe la mitad de este slice.
      # UNA POLÍTICA QUE APUNTA A UNA MÁQUINA CUYO DUEÑO DIJO QUE NO (A91).
      #
      # NO ES UNA FALLA, y por eso es `info` y no `warning`: el eje de consentimiento hizo
      # exactamente lo que promete. Lo que esta alerta existe para contestar es otra cosa — la
      # decisión de endurecer `exec` y el auto-heal bajo `pide`/`prohibido` (A86, A91) se tomó
      # pesando dos errores con la regla «el que elegimos SE NOTA: el auto-heal deja de actuar y
      # alguien lo ve». Ese «alguien lo ve» NO EXISTÍA: no había métrica ni alerta de un rechazo
      # por consentimiento, así que la premisa de la decisión era falsa. Esto es el mecanismo.
      #
      # LA VENTANA ES LARGA A PROPÓSITO: `increase[24h] > 0` con `for: 6h` significa «esto viene
      # pasando desde hace rato», no «pasó una vez». Una política frenada por consentimiento es un
      # ESTADO —dura hasta que alguien cambie el grado o saque la máquina del alcance— y avisar de
      # cada tick serían 288 notificaciones por día, que es cómo se apaga un canal.
      #
      # LO QUE NO DICE: en qué máquina. La métrica no lleva etiqueta `device` a propósito (ver
      # contarPolitica: cardinalidad políticas × máquinas × resultados, con dos mil máquinas de
      # horizonte). El journal la nombra y `musubi_fleet_cronologia` también.
      # LA COBERTURA DEL SLA SE CAYÓ, QUE NO ES LO MISMO QUE ESTAR BAJA (A93).
      #
      # NO HAY ALERTA DE «cobertura baja» a propósito: no se apaga arreglando algo —la única salida
      # es que pase el tiempo— y una alarma que no se apaga actuando es cómo se enseña a ignorar un
      # canal. Este repo ya lo pagó: trece `MaquinaCaida` que aparecían y se resolvían solas se
      # leyeron como ruido de red durante diez días (A79).
      #
      # LO ACCIONABLE ES LA CAÍDA. Mientras el TSDB acumula historia la cobertura sólo SUBE, así que
      # un `delta` negativo significa que algo se rompió: el TSDB perdió datos (le pasó el
      # 2026-08-31), el scrape se cortó, o las reglas se recargaron con otra definición. Las tres se
      # arreglan, y ninguna es «esperar».
      #
      # `for: 30m` sobre una ventana de 6 h: la caída tiene que sostenerse, para no disparar por un
      # hueco de un scrape.
      # EL DELTA VA POR MÁQUINA, ANTES DEL `min by(project)`. No es una preferencia de forma: con
      # el delta sobre la serie agregada, ESTA ALERTA DISPARABA EN CADA ENROLAMIENTO.
      #
      # `musubi:project_up:cobertura30d` es `min by(project)` de la cobertura de cada máquina, y
      # la cobertura de una máquina recién enrolada arranca en CERO —no tiene historia todavía—.
      # O sea que sumar una máquina hunde el mínimo del proyecto de golpe, el delta a 6 h da unos
      # -0,9, y suena una alerta que dice «se perdió medición» sobre un evento que es lo contrario:
      # entró una máquina más a medirse.
      #
      # Y LA PREMISA ESCRITA EN SU PROPIA NOTA ERA FALSA PARA LA SERIE QUE MIRABA. Dice «mientras
      # el TSDB acumula historia la cobertura sólo sube, así que esto es una pérdida»: cierto POR
      # MÁQUINA, falso para el mínimo del proyecto, que baja cada vez que aparece una nueva.
      #
      # Tomado por máquina, el caso se resuelve solo: la cobertura de una máquina nueva sólo SUBE
      # desde cero, así que su delta es positivo y no dispara nunca. Y como consecuencia buena, la
      # alerta ahora dice CUÁL máquina perdió medición, no sólo qué proyecto.
      - alert: CoberturaDelSlaSeCayo
        expr: delta(musubi:device_up:cobertura30d[6h]) < -0.05
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "La cobertura del SLA de {{ $labels.device }} ({{ $labels.project }}) cayó más de 5 puntos en 6 horas."
          nota: "Mientras el TSDB acumula historia la cobertura de UNA máquina sólo sube, así que esto es una pérdida real (el delta se toma por máquina justamente para que enrolar una nueva no dispare esto): revisá si Prometheus perdió datos, si el scrape del cerebro se cortó, o si las recording rules se recargaron con otra definición. Las series `:sla30d` van a DESAPARECER si la cobertura baja de 0,95, y eso es lo que evita publicar un número que no se puede sostener. Ver deploy/RUNBOOK.md#coberturadelslasecayo"

      # Y LA HERMANA, SOBRE SERVICIOS. ES LA MITAD QUE FALTABA, Y ES LA QUE SE FACTURA (A93).
      #
      # `musubi:project_service_up:cobertura30d` estaba CONSTRUIDA Y NO LA LEÍA NADIE. La de arriba
      # vigila la familia de MÁQUINAS, así que la cobertura del SLA de SERVICIOS podía perderse
      # entera sin que sonara nada: el defecto dominante de este repo —una guarda presente en N-1 de
      # N caminos— aplicado justo sobre el número que se le firma a un cliente.
      #
      # POR QUÉ LEE LA SERIE GRABADA Y NO `musubi_fleet_service_up`. Son dos trampas medidas, no
      # preferencias de estilo:
      #
      #   · DUPLICADOS POR `instance`. La métrica cruda llega DOS VECES por máquina —el scrape y el
      #     push— y un `min` sobre eso se queda con el camino MUERTO: así fue como el «peor equipo»
      #     del reporte marcó 10,2 % cuando la misma máquina, por el camino vivo, estaba en 84,7 %.
      #     `musubi:service_up:norm` colapsa los dos caminos con `max by(...)` y esta serie
      #     desciende de ella, igual que la de máquinas.
      #   · UN SERVICIO QUE DEJÓ DE REPORTAR CONSERVA SU ÚLTIMO ESTADO. Contar `== 0` sobre la tabla
      #     cruda mezcla «está fallando» con «nadie está midiendo»: el 2026-09-04 los 64 servicios de
      #     una máquina muerta publicaron `1` durante seis horas. `:norm` lleva la guarda de frescura
      #     —`unless (musubi_fleet_device_up == 0)`—, así que lo que deja de medirse SALE de la
      #     cuenta en vez de congelarse. Esta alerta habla de CUÁNTO SE ESTÁ MIDIENDO; que un
      #     servicio esté fallando lo dice `ServicioCaido`, y son dos preguntas distintas.
      #
      # LO QUE NO SIRVE PARA PREGUNTAR FRESCURA: `timestamp(last_over_time(X[30d]))` devuelve la hora
      # de EVALUACIÓN, no la de la última muestra, así que una serie muerta contesta «hace 0 min» y
      # la guarda queda en verde para siempre. Medido en este repo. Acá la frescura viaja adentro del
      # `count_over_time` de la cobertura: si dejan de entrar muestras, el conteo BAJA, y esa bajada
      # es lo que esta alerta mira.
      #
      # MISMO UMBRAL Y MISMO `for:` QUE SU HERMANA, a propósito: dos definiciones de «se cayó» para
      # el mismo reporte es exactamente cómo una de las dos se queda vieja.
      #
      # NO ES UNA ALARMA DE «COBERTURA BAJA», y la distinción importa más acá que arriba: el `min`
      # por proyecto de esta familia lo domina un servicio OCIOSO POR DISEÑO —`MapsBroker`, los
      # updaters de Google—, que no emite a propósito (A70), así que su NIVEL es bajo y no informa.
      # Su CAÍDA sí informa, porque mientras el TSDB acumula historia la cobertura sólo sube. La
      # contracara conocida es que un servicio recién declarado entra con cobertura 0 y arrastra el
      # `min` hacia abajo, igual que una máquina recién enrolada arrastra el de la alerta de arriba:
      # el runbook lo pone primero en la lista para no salir a buscar una pérdida de datos que no
      # hubo.
      # EL HERMANO EXACTO, con el mismo arreglo: el delta por servicio, antes del `min by(project)`.
      # Un servicio declarado por primera vez arranca con cobertura cero igual que una máquina
      # nueva, así que declarar un servicio hacía sonar «se perdió medición».
      - alert: CoberturaDelSlaDeServiciosSeCayo
        expr: delta(musubi:service_up:cobertura30d[6h]) < -0.05
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "La cobertura del SLA del servicio {{ $labels.service }} en {{ $labels.device }} ({{ $labels.project }}) cayó más de 5 puntos en 6 horas."
          nota: "Es el otro número que se le factura al cliente, y la cobertura de UN servicio sólo sube mientras el TSDB acumula historia: una caída es una pérdida. Ya NO hace falta descartar el servicio recién declarado: el delta se toma por servicio, y uno nuevo arranca en 0 y sólo sube, así que su delta es positivo. Revisá si Prometheus perdió datos, si el scrape del cerebro se cortó, o si las recording rules se recargaron con otra definición. `musubi:service_up:sla30d` va a DESAPARECER donde la cobertura baje de 0,95. Ver deploy/RUNBOOK.md#coberturadelsladeserviciossecayo"

      - alert: PoliticaFrenadaPorConsentimiento
        expr: increase(musubi_fleet_policy_actions_total{result=~"consentimiento_.*"}[24h]) > 0
        for: 6h
        labels: { severity: info }
        annotations:
          summary: "Una política no actúa sobre alguna máquina porque su dueño no lo permite."
          nota: "El eje funcionó: `prohibido` o `pide` frenaron el auto-heal. Lo que hay que resolver es la CONTRADICCIÓN entre una política que apunta a esa máquina y un grado que no la deja: o el dueño la baja a `avisa`, o la política deja de incluirla. Mientras siga así, esa máquina no se auto-cura y nadie más lo va a notar."
          runbook: "deploy/RUNBOOK.md#politicafrenadaporconsentimiento"

      - alert: PoliticaSinPermiso
        expr: increase(musubi_fleet_policy_actions_total{result=~"rechazada|sin_principal"}[1h]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "La política {{ $labels.policy }} quiso actuar y NO PUDO ({{ $labels.result }}): quedó inerte."
          nota: "Revisá la sección `fleet:` y `fleet_exec_allow:` del principal de esa política en principals.yaml."
          runbook: "deploy/RUNBOOK.md#politicasinpermiso"

      # Credenciales bien configuradas que chocan contra su propia allowlist. NO es un intento de
      # intrusión —para llegar acá ya había que tener `exec` sobre esa máquina— y por eso va
      # aparte de los rechazos de authz: mezclarlos entrena a ignorar los dos.
      - alert: AllowlistDeFlotaRechazando
        expr: increase(musubi_tool_rejections_total{reason="fleet_allowlist"}[1h]) > 5
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Varios exec de flota rechazados por allowlist en 1 h: o alguien necesita un comando más, o un script quedó viejo."

  # ── El latido de la cadena de alertas (S10 · I18) ─────────────────────────────────────────

      # ── Qué corre ADENTRO de cada máquina (A43) ───────────────────────────────────────────
      #
      # Las tres se apagan solas si nadie reporta servicios: sin la serie, la expresión no
      # matchea nada. Un despliegue que todavía no enumera no recibe una sola alarma.
      - alert: ServicioCaido
        # `unless on(project, device) musubi_fleet_device_up == 0` es la mitad que importa: si la MÁQUINA
        # está caída, todos sus servicios lo están, y avisar por cada uno convierte una caída en
        # cincuenta mensajes. Que la máquina se cayó ya lo dice MaquinaCaida.
        expr: (musubi_fleet_service_up == 0) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El servicio {{ $labels.service }} no está corriendo."
          runbook: "deploy/RUNBOOK.md#serviciocaido"
          ausente_en: "tier=B — un Tier B no reporta servicios: no corre nuestro agente y el sondeo por SSH no los enumera."

      # ANDA A LOS TUMBOS: está corriendo AHORA y se reinició varias veces en la última hora. Es
      # el estado que `up` no puede mostrar — en cada instante el servicio está arriba.
      - alert: ServicioReiniciandose
        expr: (increase(musubi_fleet_service_restarts_total[1h]) > 5) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} se reinició {{ $value | printf \"%.0f\" }} veces en una hora."
          runbook: "deploy/RUNBOOK.md#servicioreiniciandose"
          # A76 AFINÓ ESTA RAZÓN, y no el selector. El cabo suponía que había que acotarla a «los
          # servicios del SCM»; es al revés — el selector sólo se consulta cuando la serie ESTÁ
          # AUSENTE (verificar-cobertura.sh), así que en una Windows que reporta contenedores la
          # serie existe, la máquina cuenta como cubierta y esta excusa no se mira. Lo que había
          # que corregir es la prosa, que presentaba al SCM como la historia completa.
          ausente_en: "os=windows — el SCM no expone cuántas veces se reinició un servicio, y un 0 inventado se leería «nunca se reinició». OJO: desde A76 una Windows SÍ reporta sus contenedores, y un contenedor sí expone reinicios — así que ver esta excusa disparar sobre una Windows significa que esa máquina no corre ninguno, y eso es un dato, no una laguna; tier=B — un Tier B no reporta servicios."

      # El inventario de esa máquina dejó de llegar aunque la máquina late. Distinto de
      # ServicioCaido: acá no sabemos cómo está el servicio, y no saber no es estar bien.
      - alert: ServicioSinNoticias
        # EL TERCER `unless` ES LA DIFERENCIA ENTRE UNA ALARMA Y RUIDO.
        #
        # Los dos primeros ya existían por el mismo motivo: una máquina caída o en mantenimiento no
        # tiene 64 servicios con problema, tiene UNO. El tercero cubre el caso que faltaba: cuando
        # el enumerador de la máquina se rompe, el inventario deja de viajar entero y TODOS sus
        # servicios envejecen a la vez.
        #
        # MEDIDO EL 2026-09-09 EN `davantis-1`: 64 de estas disparando, todas de la misma máquina,
        # 61 horas sin reportar, con el agente vivo y mandando CPU y uptime. Sesenta y cuatro
        # alertas para una causa, y ninguna la nombra. Eso es exactamente cómo se le enseña a
        # alguien a ignorar un canal — los trece `MaquinaCaida` de A79 dejaron esa lección.
        #
        # No se pierde nada al callarlas: `MaquinaNoPuedeEnumerar` dispara en su lugar Y dice por
        # qué, que es lo que ninguna de las 64 podía decir.
        expr: (musubi_fleet_service_last_report_seconds > 1800) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
          unless on(project, device) (musubi_fleet_device_services_unknown == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Hace más de 30 min que no reporta el estado de {{ $labels.service }}."
          runbook: "deploy/RUNBOOK.md#serviciosinnoticias"
          ausente_en: "tier=B — un Tier B no reporta servicios."

      # ────────────────────────────────────────────────────────────────────────────────────
      # LA MÁQUINA NO PUEDE ENUMERAR, Y ESO SÓLO SE SABÍA ENTRANDO A LA MÁQUINA
      #
      # Cuando `enumerarServicios` falla, el agente NO manda el inventario —a propósito: media
      # lista haría que el cerebro pode lo que no vino— y lo escribe en SU log, una vez por hora.
      # Desde el cerebro ese silencio era idéntico al de un inventario que no cambió.
      #
      # Lo único que se veía era `ServicioSinNoticias` a los 30 minutos, multiplicado por cada
      # servicio conocido, y sin la causa. Esta alerta es UNA, llega antes, y la nombra.
      # --- EL EJE APAGADO TIENE NOMBRE (y antes era silencio) ---
      #
      # `MaquinaNoPuedeEnumerar` y `ServiciosRecortados` dependen de series que el exportador
      # OMITE cuando el agente declara un capver por debajo de 2. La omisión es correcta —un
      # agente viejo no puede distinguir «enumeré bien» de «no sé enumerar», y afirmar 0 sería una
      # alerta PERDIDA— pero desde Prometheus la ausencia era muda: «el eje está apagado porque el
      # agente es viejo» y «esta máquina no existe» se ven exactamente igual.
      #
      # Las dos alertas que cerraron A116 nacieron así, mudas para toda la flota: el Capver subió
      # a 2 el 2026-09-10 y los binarios de los agentes se cruzan A MANO, máquina por máquina.
      #
      # Estas dos le ponen nombre a esa ausencia. No reemplazan a `AgenteDesactualizado`, que
      # compara la VERSIÓN del producto: dos builds distintos pueden hablar el mismo contrato, y
      # es justo lo que permite desplegar sin romper.
      - alert: AgenteSinContratoDeclarado
        expr: >-
          musubi_fleet_device_up{tier="A"} == 1
          unless on(project, device) musubi_fleet_device_capver
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "El agente de {{ $labels.device }} no declara qué contrato habla: los ejes de inventario están apagados ahí."
          nota: "El agente es anterior a la pieza de capver. Mientras no declare, `musubi_fleet_device_services_unknown` y `services_omitted` NO se emiten para esta máquina, así que MaquinaNoPuedeEnumerar y ServiciosRecortados no pueden dispararse sobre ella — no por estar sanas, sino por ignorancia. Se arregla actualizando el agente: deploy/actualizar-agente-windows.sh."

      - alert: AgenteConContratoViejo
        expr: >-
          musubi_fleet_device_capver < 2
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "El agente de {{ $labels.device }} declara capver {{ $value }} y los ejes de inventario necesitan 2."
          nota: "Mismo efecto que AgenteSinContratoDeclarado: los ejes que A116 cerró están apagados en esta máquina. La diferencia es que ésta SÍ declara, así que se sabe exactamente qué le falta."

      # --- DOS AGENTES SOBRE UNA FILA ---
      #
      # La credencial del latido es de la MÁQUINA y no del proceso, así que dos agentes corriendo
      # a la vez —un servicio más una corrida a mano, una instalación duplicada, un zombi del
      # binario renombrado— escriben los dos sobre la misma fila. El cerebro veía un único agente
      # sano latiendo el doble de seguido.
      #
      # Así se cerró A92 con el problema todavía puesto: el diagnóstico se hizo midiendo la
      # CADENCIA —un diente de sierra de 37,8 s contra 25,8 s del vecino—, una inferencia sobre un
      # efecto de segundo orden que sólo se puede hacer mirando a mano y sabiendo de antemano que
      # hay que mirar.
      #
      # `musubi_fleet_device_emitter_stable_seconds` lo dice sin inferir nada: con UN agente
      # crece sin parar; con dos alternándose cada uno pisa la marca del otro y se queda pegada al
      # cero. El umbral de 10 min con `for: 30m` deja pasar los reinicios legítimos —un agente que
      # arranca empieza en cero y a los 10 minutos ya salió de la zona— y no deja pasar dos
      # agentes, que no salen nunca.
      # --- LA MÁQUINA SE DIO DE BAJA (y por eso se callaron sus alertas) ---
      #
      # Revocar una máquina la saca del export: sus series se vuelven obsoletas y TODAS sus
      # alertas se resuelven solas. Del otro lado del canal, «se arregló» y «la sacamos del
      # inventario» llegaban como el MISMO `[RESOLVED]`, sin una palabra que los distinga — y
      # quien lo lee concluye que el problema se atendió. La máquina con el disco lleno que se dio
      # de baja sin arreglar quedaba cerrada en la cabeza de todos.
      #
      # ES `info` Y NO UNA ADVERTENCIA: no hay nada que arreglar. Existe para que el aviso VIAJE
      # POR EL MISMO CANAL que las resoluciones que la baja produjo, y llegue junto con ellas.
      #
      # `for: 0m` a propósito: el valor de este aviso es llegar AL MISMO TIEMPO que los resolved,
      # y cualquier espera lo deja llegando después — cuando ya nadie está mirando ese hilo.
      # --- UNA CREDENCIAL QUE NO PUEDE ROTAR NUNCA ---
      #
      # `musubi_fleet_device_token_rotable` existe desde A88 y NO LA LEÍA NINGUNA REGLA. Vale 0
      # cuando el agente recibió su credencial por VARIABLE DE ENTORNO, y eso no es una molestia:
      # es que la rotación de esa máquina NO SE PUEDE COMPLETAR NUNCA. Un proceso no puede
      # reescribir su propio entorno, así que el token nuevo llega, el agente no lo puede guardar,
      # y a las 24 h la rotación se abandona sola. Para siempre, en cada intento.
      #
      # Y EL COSTO NO TERMINA AHÍ: con la credencial en el entorno, cualquier proceso del mismo
      # usuario la lee, y sobrevive a que alguien arregle el archivo. Es el mecanismo exacto de
      # A88, mirado desde el otro lado.
      #
      # El arreglo es del LANZADOR, no del agente: tiene que pasar `MUSUBI_DEVICE_TOKEN_FILE` con
      # la RUTA del archivo en vez de meter el valor en el entorno.
      #
      # AUSENTE significa «el agente no lo reporta» (binario viejo) y ahí la alerta no dispara: un
      # 0 inventado acusaría a la máquina de algo que nadie midió.
      - alert: CredencialQueNoPuedeRotar
        expr: >-
          musubi_fleet_device_token_rotable == 0
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "La credencial de {{ $labels.device }} vino por VARIABLE de entorno: su rotación no se puede completar nunca."
          nota: "Un proceso no puede reescribir su propio entorno, así que el token nuevo llega, el agente no lo puede guardar, y la rotación se abandona sola a las 24 h — en cada intento, para siempre. Y mientras tanto la credencial vive en el entorno del proceso, donde la lee cualquier proceso del mismo usuario. Se arregla en el LANZADOR: que pase `MUSUBI_DEVICE_TOKEN_FILE` con la RUTA del archivo. En Windows lo migra `deploy/actualizar-agente-windows.sh`."

      # --- UNA ROTACIÓN DE TOKEN QUE NADIE COMPLETA ---
      #
      # El estado estaba guardado en la base desde siempre y NO LO MIRABA NADIE: ni el doctor, ni
      # el panel, ni una alerta. El barrido que las abandona devuelve un número que se escribía en
      # un log y nada más. Una operación que no terminó se veía igual que una que nunca empezó.
      #
      # ABANDONARLA NO ROMPE NADA —la rotación es HIGIENE y no emergencia: el agente se queda con
      # el token viejo, que es el estado que ya había, y si un token se filtró lo que corresponde
      # es REVOCAR, que es instantáneo y no depende de que el agente coopere—. Lo que sí pasa es
      # que la higiene no se hizo, y hasta ahora nadie se enteraba.
      #
      # Dispara con 6 h de margen: da tiempo a mirar por qué el agente no levantó el token nuevo
      # antes de que la ventana se cierre sola.
      # LA VENTANA DE MANTENIMIENTO LA CALLA, y acá el caso es directo: reinstalar el agente es
      # mantenimiento, y un agente que se está reinstalando no va a completar ninguna rotación.
      # Sin la guarda, arreglar dispara la alarma.
      # --- LA MISMA MÁQUINA LLEGANDO DOS VECES ---
      #
      # `prometheus.yml` descarta `musubi_fleet_(device|service)_.*` del scrape justamente para
      # que cada dato tenga UN SOLO PRODUCTOR: esa familia llega por el empuje OTLP. Si el
      # descarte se saca, se comenta, o se despliega un `prometheus.yml` viejo, cada máquina
      # empieza a llegar DOS veces con `instance` distinto.
      #
      # Y NO SE VE COMO UN ERROR: se ve como que todo anda. Cada regla de flota matchea dos series
      # y cada alerta sale DUPLICADA — medido acá el 2026-08-28 al encender el empuje: 5 alertas,
      # 10 avisos. Peor todavía, el `min` del SLA se queda con el camino MUERTO: así fue como el
      # «peor equipo» del reporte marcó 10,2 % cuando la misma máquina, por el camino vivo, estaba
      # en 84,7 %.
      #
      # LAS RECORDING RULES YA LO COLAPSAN con `max by(...)`, y eso arregló el reporte — pero no
      # DETECTA nada: la duplicación sigue ahí, invisible, y cualquier regla nueva escrita contra
      # la familia cruda vuelve a disparar doble. Esta alerta mira la causa y no el síntoma.
      #
      # `for: 1h` porque durante una transición legítima —encender el empuje, cambiar el
      # descarte— las series viejas conviven con las nuevas hasta que caducan. Una hora deja pasar
      # eso y no deja pasar una configuración mal desplegada.
      - alert: LaMismaMaquinaLlegaDosVeces
        expr: >-
          count by(project, device) (musubi_fleet_device_up) > 1
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} llega {{ $value }} veces a Prometheus: cada alerta suya va a salir duplicada."
          nota: "Revisá el `metric_relabel_configs` de `deploy/prometheus/prometheus.yml`: tiene que descartar `musubi_fleet_(device|service)_.*` en el job del cerebro, porque esa familia llega por el empuje OTLP. Sin ese descarte cada dato tiene DOS productores. Mirá los valores de `instance`: `musubi-brain` es el scrape y `musubi-otlp-push` el empuje."

      - alert: RotacionDeTokenSinCompletar
        expr: >-
          musubi_fleet_rotation_expires_in_seconds < 21600
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "La rotación del token de {{ $labels.device }} lleva abierta demasiado: le quedan {{ $value | humanizeDuration }}."
          nota: "El agente tiene que latir con el token NUEVO para que la rotación se cierre; mientras no lo haga, sigue valiendo el viejo. Si la máquina no está latiendo, la rotación no es el problema. Si late y no completa, revisá que su credencial venga por ARCHIVO y no por variable de entorno (`musubi_fleet_device_token_rotable`): un proceso no puede reescribir su propio entorno, así que con `variable` la rotación NO se puede completar nunca."

      - alert: MaquinaRevocada
        expr: musubi_fleet_revoked_ago_seconds >= 0
        for: 0m
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.device }} se dio de BAJA del inventario: sus alertas se van a resolver solas, y no porque se hayan arreglado."
          nota: "Este aviso existe para que las resoluciones que vas a ver de esta máquina no se lean como arreglos. Si la diste de baja con algo sin resolver —un disco lleno, un servicio caído— eso sigue igual: la máquina salió del inventario, el problema no. La serie dura 24 h y después desaparece sola."

      - alert: DosAgentesSobreLaMismaMaquina
        expr: >-
          musubi_fleet_device_emitter_stable_seconds < 600
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "El proceso que late por {{ $labels.device }} cambia todo el tiempo: hay más de un agente corriendo."
          nota: "Media hora sin que el emisor se estabilice no es un reinicio: son dos procesos pisándose. Mirá si quedó un `musubi agent` a mano además del servicio, una segunda instalación, o un zombi de `musubi.exe.viejo` (deploy/matar-zombis-agente.sh). Dos agentes duplican los comandos que ejecuta la máquina y hacen que el inventario se pise."

      - alert: MaquinaNoPuedeEnumerar
        # EL `device_up == 0` NO ES OPCIONAL, y lo cazó `TestNingunaAlertaDeMuestraDisparaSobreUnaMaquinaCaida`
        # cuando esta alerta se escribió sin él: la serie se CONGELA cuando la máquina muere, así
        # que sin la guarda esto dispararía sobre la última muestra que llegó antes de morir — dos
        # alertas para un solo evento, con `MaquinaCaida` ya diciendo lo que pasa. Es exactamente el
        # ruido que esta alerta viene a REDUCIR, reproducido un piso más arriba.
        expr: musubi_fleet_device_services_unknown == 1
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} no puede enumerar sus servicios: su inventario dejó de viajar."
          nota: "El agente está VIVO —esto no dice nada de la máquina— pero su enumerador falla, así que el inventario no se manda y lo que el cerebro tiene envejece sin actualizarse. No se poda nada, así que no se pierde: queda viejo. POR QUÉ falla lo dice `musubi_fleet_list` en el campo `servicios_error` de esa máquina; las causas típicas se arreglan distinto (falta un binario, WMI no contesta, el usuario no tiene permiso). Mientras esto dispara, `ServicioSinNoticias` está callada para esta máquina a propósito: son 64 síntomas de un problema."
          runbook: "deploy/RUNBOOK.md#maquinanopuedeenumerar"
          ausente_en: "tier=B — un Tier B no reporta servicios."

      # ────────────────────────────────────────────────────────────────────────────────────
      # EL INVENTARIO ESTÁ INCOMPLETO Y HASTA HOY NO LO DECÍA NADIE (A116)
      #
      # El latido lleva un techo (`fleet.ServiciosPorLatido`) y el agente ordena por prioridad
      # —fallado, detenido, corriendo, desconocido— antes de recortar. El número de omitidos lo
      # calculaba el agente y lo escribía en SU log, en la máquina, una vez por arranque: donde
      # nadie mira. Desde el cerebro, una lista truncada de 64 y un inventario completo de 64 eran
      # el mismo mensaje.
      #
      # Y no era una ceguera sino una AFIRMACIÓN FALSA: la poda da de baja lo que no vino, así que
      # el cerebro anotaba `revoked = 1` sobre servicios que estaban corriendo. Medido el
      # 2026-09-05 en `davantis-1`, que reporta exactamente 64: 26 de clase `docker` y 87 de
      # Windows revocados por la rotación del recorte, entre ellos los 11 contenedores de
      # `altura-erp`. Desde A116 la poda se SUSPENDE mientras haya recorte, así que el registro
      # dejó de mentir — pero el inventario sigue incompleto, y eso es lo que dice esta alerta.
      #
      # LAS TRES QUE LEEN ESA LISTA COMO SI FUERA EL INVENTARIO son `ServicioCaido`,
      # `ServicioSinNoticias` y `MaquinaSinInventario`, las tres de este mismo archivo. Ninguna
      # está mal escrita; todas deciden sobre un universo recortado sin saberlo. Ésta es la única
      # que puede decírselo a alguien.
      #
      # `> 0` y no un umbral: no hay un número de servicios invisibles que esté bien. Y `for` de
      # 1 h porque el arreglo no es urgente ni automático —subir el techo o filtrar el ruido son
      # decisiones— y una alarma que aparece a los cinco minutos de cada reinicio se ignora.
      #
      # Y LAS DOS GUARDAS DE SIEMPRE, que acá no son ceremonia. `services_omitted` es un valor
      # REPORTADO: se congela con el último latido, así que una máquina muerta lo sigue publicando
      # tal cual y esta regla dispararía sobre el recuerdo de una máquina que ya no está — dos
      # alertas para un solo evento, con `MaquinaCaida` diciendo lo que de verdad pasa. Y una
      # ventana de mantenimiento la calla por lo mismo que a sus 18 hermanas (A97). Lo cazó
      # `TestNingunaAlertaDeMuestraDisparaSobreUnaMaquinaCaida` sobre esta misma regla, recién
      # escrita.
      - alert: InventarioDeServiciosIncompleto
        expr: >-
          musubi_fleet_device_services_omitted > 0
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} servicio(s) de esta máquina no entran en el latido: el inventario del cerebro está incompleto."
          nota: "El agente prioriza fallados y detenidos, así que lo que falta son los que están CORRIENDO BIEN — justo los que uno no extraña hasta que los necesita. Mientras dure, la poda por ausencia está suspendida para esta máquina, o sea que el inventario tampoco se limpia solo. Ver deploy/RUNBOOK.md#inventariodeserviciosincompleto"
          runbook: "deploy/RUNBOOK.md#inventariodeserviciosincompleto"
          ausente_en: "tier=B — un Tier B no reporta servicios."

      # ────────────────────────────────────────────────────────────────────────────────────
      - alert: MaquinaSinInventario
        # UNA MÁQUINA CON AGENTE QUE NO DICE QUÉ CORRE ADENTRO.
        #
        # Nació de una auditoría, no de una hipótesis: `kernelos-pc` (hoy `davantis-1`) figuraba en
        # línea, latiendo cada 30 s, y con CERO servicios. Resultó ser un binario anterior a la
        # enumeración — pero el síntoma es idéntico al de un enumerador roto, y al de una
        # fuente que falló y abortó el inventario a propósito. Las tres causas piden lo mismo:
        # que alguien mire.
        #
        # `== 1` y no `unless` sobre el up: una máquina CAÍDA no tiene por qué reportar
        # inventario, y alertar de eso sería duplicar MaquinaCaida con otro nombre.
        #
        # Sólo Tier A: un Tier B no corre nuestro binario y no tiene con qué enumerarse.
        # Y LA VENTANA DE MANTENIMIENTO TAMBIÉN LA CALLA: reinstalar el agente es mantenimiento, y
        # un agente recién puesto late (`device_up == 1`) ANTES de haber enumerado nada — que es
        # exactamente la condición de esta regla. Sin la guarda, arreglar dispara la alarma.
        # CUENTA `service_declared` Y NO `service_up`, y la diferencia es un falso positivo entero.
        #
        # `musubi_fleet_service_up` se OMITE para los servicios en estado `ocioso` (A70) y
        # `desconocido`: son afirmaciones que no se pueden hacer. O sea que una máquina que reportó
        # su inventario COMPLETO, con todos sus servicios ociosos o sin estado conocido, no produce
        # ni una serie `service_up` — y esta regla la acusaba de «no decir qué corre adentro».
        #
        # `musubi_fleet_service_declared` vale 1 SIEMPRE que el servicio esté declarado en la
        # máquina, y su propio HELP dice que existe justamente para que esa ausencia se pueda
        # nombrar. Contar la que se omite para preguntar «¿reportó inventario?» es preguntarle a la
        # serie equivocada.
        expr: >-
          (musubi_fleet_device_up{tier="A"} == 1)
            unless on(project, device) count by(project, device) (musubi_fleet_service_declared)
            unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Late pero no dice qué corre adentro."
          description: >-
            La máquina reporta su telemetría y no su inventario de servicios. Sostenido 15 minutos,
            que es el triple del reenvío periódico del inventario.
          runbook: "deploy/RUNBOOK.md#maquinasininventario"

      # ── El RENDIMIENTO de un servicio (fase 4) ────────────────────────────────────────────
      #
      # Estas tres miran algo que `musubi_fleet_service_up` NO PUEDE VER: un servicio cuyo proceso
      # está perfectamente vivo mientras hace mal su trabajo. Para un bot es la única señal que
      # importa — systemd lo ve corriendo tanto si contesta bien como si contesta cualquier cosa.
      #
      # LAS TRES SE APAGAN SOLAS donde no aplican: `musubi_fleet_service_handled` está AUSENTE en
      # todo servicio que no reporte rendimiento, que es la enorme mayoría. Un servicio de systemd
      # no dispara ninguna de éstas nunca, y por eso se pueden instalar siempre.
      - alert: ServicioFallandoPorDentro
        # Sobre la ventana que el propio colector declaró, no sobre una inventada acá.
        expr: >
          (100 * musubi_fleet_service_failed / musubi_fleet_service_handled > 20
          and musubi_fleet_service_handled > 10)
          unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} corre y falla más de 1 de cada 5."
          runbook: "deploy/RUNBOOK.md#serviciofallandopordentro"
          ausente_en: "sin-declarar — el conteo de atendidos/fallados lo empuja cada servicio y es opt-in; tier=B — un Tier B no reporta servicios."

      # EL COLECTOR SE MURIÓ, que NO es lo mismo que «el servicio no tuvo trabajo». La diferencia
      # es exactamente por qué el colector empuja un 0 en vez de callarse: con el 0, la serie
      # existe y vale cero; sin colector, la serie DESAPARECE. Esta regla mira la desaparición.
      - alert: ColectorDeRendimientoMudo
        expr: (musubi_fleet_service_last_report_seconds > 600 and on(project, device, service) musubi_fleet_service_handled) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} reportaba rendimiento y hace más de 10 minutos que no."
          runbook: "deploy/RUNBOOK.md#colectorderendimientomudo"
          ausente_en: "sin-declarar — sólo aplica a los servicios que YA empujaban rendimiento, que es opt-in; tier=B — un Tier B no reporta servicios."

      - alert: ServicioLento
        expr: (musubi_fleet_service_latency_p95_ms > 5000) unless on(project, device) (musubi_fleet_device_up == 0)
          unless on(project, device) (musubi_fleet_device_maintenance == 1)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "El p95 de {{ $labels.service }} pasa los 5 segundos."
          runbook: "deploy/RUNBOOK.md#serviciolento"
          ausente_en: "sin-declarar — la latencia la empuja cada servicio con el colector de rendimiento, que es opt-in; tier=B — un Tier B no reporta servicios."

  # ── LA CUSTODIA CRUZADA (A73) ─────────────────────────────────────────────────────────────
  #
  # Este grupo no vigila a la flota: vigila al OTRO ARCHIVO DE REGLAS. Y eso tiene una razón
  # exacta que vale entender antes de tocarlo.
  #
  # A73 salió de un caso real: `TestLaCadenaDeAlertasSeVigilaASiMisma` pasaba en verde mientras el
  # job `alertmanager` NO estaba desplegado, así que `CadenaDeAlertasFallando` —la alerta que
  # vigila que las alertas se entreguen— no podía dispararse nunca. La guarda leía el repo; el
  # servidor corría otro archivo. Había 29 reglas cargadas contra 31 en el repo.
  #
  # POR QUÉ CRUZADO Y NO CADA ARCHIVO SOBRE SÍ MISMO. Un archivo que declara su propio conteo se
  # despliega junto con el conteo: las dos mitades se mueven a la vez y la comprobación nunca
  # falla. Cruzándolos, un despliegue a medias rompe la simetría en la dirección que sea — se
  # copió éste y no aquél, o al revés— y alguno de los dos grita.
  #
  # EL NÚMERO NO PUEDE PUDRIRSE EN EL REPO: lo calcula
  # `TestCadaArchivoDeReglasCustodiaElConteoDelOtro` a partir del YAML, así que agregar una alerta
  # sin actualizar el conteo rompe la suite acá abajo, en el repo, antes de llegar a producción.
  - name: musubi-custodia
    rules:
      # LA DEL SLA VIVE ACÁ Y NO EN musubi-alerts.yml, Y ESO NO ES ARBITRARIO: este archivo se
      # instala SÓLO si el cerebro expone flota (ver preparar.sh), y las 11 recording rules del SLA
      # miden series de flota. O sea que la condición «hay flota» ya la garantiza el hecho de que
      # esta regla exista, y por eso la expresión puede ser la simple —`absent(...) or != 11`— sin
      # el `and on() (count(musubi_fleet_device_up) > 0)` que ReglasDeFlotaSinDesplegar necesita.
      #
      # POR QUÉ HACÍA FALTA (A93, medido el 2026-09-05): de las tres familias de reglas, el SLA era
      # la ÚNICA sin red. `musubi-recording.yml` no lo copiaba ningún guion y no lo contaba ninguna
      # alerta; las otras dos se custodian cruzadas justamente contra esto. Se veía en las edades:
      # `musubi:device_up:norm` tenía 11,9 h de historia y `musubi:service_up:cobertura30d` 6,25 h
      # —tres instalaciones a mano en tres momentos distintos—, y ese mismo despliegue había
      # cambiado el archivo. Lo que se le firma a un cliente no puede ser lo único sin guarda.
      - alert: ReglasDelSlaSinDesplegar
        expr: >-
          absent(sum(prometheus_rule_group_rules{rule_group=~".*musubi-recording\\.yml;.*"}))
          or sum(prometheus_rule_group_rules{rule_group=~".*musubi-recording\\.yml;.*"}) != 14
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Las recording rules del SLA que corren no son las que declara el repo."
          nota: "O el archivo no está cargado, o quedó una versión vieja. Es el número que se le factura a un cliente: un avg30d viejo sigue dando un resultado plausible, así que esta alerta es la única señal. `deploy/verificar-despliegue.sh` lo compara contra el repo. Ver deploy/RUNBOOK.md#reglasdelslasindesplegar"

      - alert: ReglasDelCerebroSinDesplegar
        # `absent(sum(...))` cubre «el archivo no está cargado» y el `!=` cubre «está cargado pero
        # no es el del repo». Son dos fallas distintas con el mismo arreglo, así que van juntas.
        expr: >-
          absent(sum(prometheus_rule_group_rules{rule_group=~".*musubi-alerts\\.yml;.*"}))
          or sum(prometheus_rule_group_rules{rule_group=~".*musubi-alerts\\.yml;.*"}) != 29
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Las reglas del cerebro que corren no son las que declara el repo."
          nota: "O el archivo no está cargado, o quedó una versión vieja. `deploy/verificar-despliegue.sh` dice exactamente cuáles faltan o sobran. Ver deploy/RUNBOOK.md#reglasdelcerebrosindesplegar"

# musubi-alerts-flota.yml — las alertas del track «Control de flota».
#
# ────────────────────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESTÁN EN UN ARCHIVO APARTE
#
# Estas reglas miran métricas que sólo existen si el cerebro desplegado TIENE el plano de flota.
# Cargarlas contra un cerebro que no lo tiene no es inocuo: `FlotaSinTelemetria` es
# `absent(musubi_fleet_device_up)`, así que **dispara de inmediato y para siempre** — una alarma
# falsa desde el día uno, que es exactamente lo que enseña a ignorar las alarmas.
#
# `preparar.sh` le pregunta al cerebro si expone `musubi_fleet_*` y sólo instala este archivo si
# la respuesta es sí. Si no, lo deja al lado con otro nombre y lo dice. La regla no está mal: le
# falta su precondición, y esa distinción tiene que ser visible.
# ────────────────────────────────────────────────────────────────────────────────────────────

groups:
  - name: musubi-flota
    rules:
      # --- La máquina dejó de latir ---
      # up == 0 lo deriva el cerebro con su propio umbral (90s = 3 latidos), así que esto no
      # duplica el criterio: lo reexporta.
      - alert: MaquinaCaida
        expr: musubi_fleet_device_up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "La máquina {{ $labels.device }} ({{ $labels.project }}) no late hace más de 5 min."
          runbook: "Revisá el agente: `systemctl status musubi-agent` en esa máquina, o si fue revocada (musubi_fleet_list --include_revoked)."

      # --- El agente late pero dejó de MEDIR ---
      # Es el fallo silencioso que un `up` no detecta: el proceso vive, el colector murió. Sin
      # esta regla, el panel muestra la última muestra buena para siempre y parece sana.
      - alert: MaquinaLateSinMedir
        expr: musubi_fleet_device_sample_age_seconds > 600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} late pero su última muestra tiene {{ $value | humanizeDuration }}."
          runbook: "El agente vive y el colector no. Mirá su salida: puede ser un OS sin colector, o /proc inaccesible."

      # --- Disco ---
      # Se alerta sobre AVAILABLE, no sobre usado. No es lo mismo: el kernel reserva ~5% para
      # root, así que un disco "al 92% usado" puede tener 0 bytes escribibles para una aplicación.
      - alert: DiscoPorLlenarse
        expr: musubi_fleet_device_disk_available_bytes / musubi_fleet_device_disk_total_bytes < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "A {{ $labels.device }} le queda menos del 10% de disco escribible."
          runbook: "OJO: es espacio DISPONIBLE, no 'no usado'. La reserva de root no cuenta."

      - alert: DiscoCasiLleno
        expr: musubi_fleet_device_disk_available_bytes / musubi_fleet_device_disk_total_bytes < 0.03
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A {{ $labels.device }} le queda menos del 3% de disco escribible."

      # --- Memoria y CPU sostenidas ---
      # `for` largo a propósito: un pico de 5 minutos es trabajo, no un incidente. Lo que importa
      # es lo sostenido.
      - alert: MemoriaSostenida
        expr: musubi_fleet_device_memory_used_bytes / musubi_fleet_device_memory_total_bytes > 0.92
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} lleva 20 min con más del 92% de RAM usada."
          runbook: "Usada = total - MemAvailable, así que el page cache NO cuenta: esto es presión real."

      - alert: CPUSostenida
        expr: musubi_fleet_device_cpu_percent > 90
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} lleva 30 min con la CPU por encima del 90%."

      # --- Carga por core ---
      # Normalizada por CPUs: una carga de 8 es normal en 12 cores y grave en 2.
      - alert: CargaPorCoreAlta
        expr: musubi_fleet_device_load5 / musubi_fleet_device_cpus > 2
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }}: carga a 5 min de {{ $value | printf \"%.1f\" }}× la cantidad de cores."

      # --- Temperatura ---
      # Sólo dispara donde hay sensor: la serie no existe en las máquinas sin él, así que esto
      # no alerta por ausencia de dato (que es justamente lo que un 0 inventado habría hecho).
      - alert: TemperaturaAlta
        expr: musubi_fleet_device_temperature_celsius > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} a {{ $value | printf \"%.0f\" }}°C."

      # --- LA TRAMPA SILENCIOSA ---
      # Si el scrape pierde sus concesiones (alguien editó principals.yaml, se revocó el token),
      # TODAS las series de flota desaparecen y las alertas de arriba dejan de disparar — sin
      # que nada falle. Una alerta que se apaga sola es peor que no tenerla.
      - alert: FlotaSinTelemetria
        expr: absent(musubi_fleet_device_up)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "No llega NINGUNA métrica de flota: el resto de las alertas de flota están ciegas."
          runbook: "Revisá la sección `fleet:` del principal del scrape en .musubi/principals.yaml. Ver deploy/prometheus/prometheus.yml."


  # ── El auto-heal se vigila a sí mismo (S10 · A10) ─────────────────────────────────────────

  - name: musubi-politicas
    rules:
      # UNA POLÍTICA QUE ACTÚA Y NO CURA ES PEOR QUE NO TENER POLÍTICA.
      #
      # El auto-heal tapa el síntoma: la alerta de disco/memoria deja de dispararse porque la
      # política la baja justo a tiempo, una y otra vez, y nadie se entera de que hay un problema
      # de fondo. Un `journalctl --vacuum` cada hora durante una semana no es mantenimiento: es
      # algo que escribe log sin parar y que nadie fue a mirar.
      #
      # El umbral está atado al cooldown mínimo razonable: más de 3 acciones en 6 h significa que
      # la condición vuelve a cruzarse apenas se suelta el cooldown.
      - alert: PoliticaQueNoCura
        expr: increase(musubi_fleet_policy_actions_total{result="ok"}[6h]) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "La política {{ $labels.policy }} actuó {{ $value | printf \"%.0f\" }} veces en 6 h: está tapando el síntoma, no curándolo."
          runbook: "deploy/RUNBOOK.md#politicaquenocura"

      # La política está viva pero NO PUEDE actuar: su principal perdió la concesión `exec`, o el
      # comando dejó de estar en su allowlist. Es una alarma apagada, y una alarma apagada en
      # silencio es la razón por la que existe la mitad de este slice.
      - alert: PoliticaSinPermiso
        expr: increase(musubi_fleet_policy_actions_total{result=~"rechazada|sin_principal"}[1h]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "La política {{ $labels.policy }} quiso actuar y NO PUDO ({{ $labels.result }}): quedó inerte."
          runbook: "Revisá la sección `fleet:` y `fleet_exec_allow:` del principal de esa política en principals.yaml. Ver deploy/RUNBOOK.md#politicasinpermiso"

      # Credenciales bien configuradas que chocan contra su propia allowlist. NO es un intento de
      # intrusión —para llegar acá ya había que tener `exec` sobre esa máquina— y por eso va
      # aparte de los rechazos de authz: mezclarlos entrena a ignorar los dos.
      - alert: AllowlistDeFlotaRechazando
        expr: increase(musubi_tool_rejections_total{reason="fleet_allowlist"}[1h]) > 5
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Varios exec de flota rechazados por allowlist en 1 h: o alguien necesita un comando más, o un script quedó viejo."

  # ── El latido de la cadena de alertas (S10 · I18) ─────────────────────────────────────────

      # ── Qué corre ADENTRO de cada máquina (A43) ───────────────────────────────────────────
      #
      # Las tres se apagan solas si nadie reporta servicios: sin la serie, la expresión no
      # matchea nada. Un despliegue que todavía no enumera no recibe una sola alarma.
      - alert: ServicioCaido
        # `unless on(device) musubi_fleet_device_up == 0` es la mitad que importa: si la MÁQUINA
        # está caída, todos sus servicios lo están, y avisar por cada uno convierte una caída en
        # cincuenta mensajes. Que la máquina se cayó ya lo dice MaquinaCaida.
        expr: (musubi_fleet_service_up == 0) unless on(device) (musubi_fleet_device_up == 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El servicio {{ $labels.service }} de {{ $labels.device }} no está corriendo."
          runbook: "deploy/RUNBOOK.md#serviciocaido"

      # ANDA A LOS TUMBOS: está corriendo AHORA y se reinició varias veces en la última hora. Es
      # el estado que `up` no puede mostrar — en cada instante el servicio está arriba.
      - alert: ServicioReiniciandose
        expr: increase(musubi_fleet_service_restarts_total[1h]) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} en {{ $labels.device }} se reinició {{ $value | printf \"%.0f\" }} veces en una hora."
          runbook: "deploy/RUNBOOK.md#servicioreiniciandose"

      # El inventario de esa máquina dejó de llegar aunque la máquina late. Distinto de
      # ServicioCaido: acá no sabemos cómo está el servicio, y no saber no es estar bien.
      - alert: ServicioSinNoticias
        expr: (musubi_fleet_service_last_report_seconds > 1800) unless on(device) (musubi_fleet_device_up == 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Hace más de 30 min que {{ $labels.device }} no reporta el estado de {{ $labels.service }}."
          runbook: "deploy/RUNBOOK.md#serviciosinnoticias"

      # ────────────────────────────────────────────────────────────────────────────────────
      - alert: MaquinaSinInventario
        # UNA MÁQUINA CON AGENTE QUE NO DICE QUÉ CORRE ADENTRO.
        #
        # Nació de una auditoría, no de una hipótesis: `kernelos-pc` figuraba en línea, latiendo
        # cada 30 s, y con CERO servicios. Resultó ser un binario anterior a la enumeración —
        # pero el síntoma es idéntico al de un enumerador roto, y al de una fuente que falló y
        # abortó el inventario a propósito. Las tres causas piden lo mismo: que alguien mire.
        #
        # `== 1` y no `unless` sobre el up: una máquina CAÍDA no tiene por qué reportar
        # inventario, y alertar de eso sería duplicar MaquinaCaida con otro nombre.
        #
        # Sólo Tier A: un Tier B no corre nuestro binario y no tiene con qué enumerarse.
        expr: >-
          (musubi_fleet_device_up{tier="A"} == 1)
            unless on(device) count by(device) (musubi_fleet_service_up)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} late pero no dice qué corre adentro"
          description: >-
            La máquina reporta su telemetría y no su inventario de servicios. Sostenido 15 minutos,
            que es el triple del reenvío periódico del inventario.
          runbook: "deploy/RUNBOOK.md#maquinasininventario"

      # ── El RENDIMIENTO de un servicio (fase 4) ────────────────────────────────────────────
      #
      # Estas tres miran algo que `musubi_fleet_service_up` NO PUEDE VER: un servicio cuyo proceso
      # está perfectamente vivo mientras hace mal su trabajo. Para un bot es la única señal que
      # importa — systemd lo ve corriendo tanto si contesta bien como si contesta cualquier cosa.
      #
      # LAS TRES SE APAGAN SOLAS donde no aplican: `musubi_fleet_service_handled` está AUSENTE en
      # todo servicio que no reporte rendimiento, que es la enorme mayoría. Un servicio de systemd
      # no dispara ninguna de éstas nunca, y por eso se pueden instalar siempre.
      - alert: ServicioFallandoPorDentro
        # Sobre la ventana que el propio colector declaró, no sobre una inventada acá.
        expr: >
          100 * musubi_fleet_service_failed / musubi_fleet_service_handled > 20
          and musubi_fleet_service_handled > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} en {{ $labels.device }} corre y falla más de 1 de cada 5."
          runbook: "deploy/RUNBOOK.md#serviciofallandopordentro"

      # EL COLECTOR SE MURIÓ, que NO es lo mismo que «el servicio no tuvo trabajo». La diferencia
      # es exactamente por qué el colector empuja un 0 en vez de callarse: con el 0, la serie
      # existe y vale cero; sin colector, la serie DESAPARECE. Esta regla mira la desaparición.
      - alert: ColectorDeRendimientoMudo
        expr: musubi_fleet_service_last_report_seconds > 600 and on(device, service) musubi_fleet_service_handled
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} reportaba rendimiento y hace más de 10 minutos que no."
          runbook: "deploy/RUNBOOK.md#colectorderendimientomudo"

      - alert: ServicioLento
        expr: musubi_fleet_service_latency_p95_ms > 5000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "El p95 de {{ $labels.service }} en {{ $labels.device }} pasa los 5 segundos."
          runbook: "deploy/RUNBOOK.md#serviciolento"

# compose.yml — la CADENA DE ALERTAS de Musubi (Prometheus + Alertmanager) en Docker.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESTE ARCHIVO EXISTE
#
# `deploy/` tenía las reglas de alerta (`musubi-alerts.yml`), el ruteo (`alertmanager.yml`) y un
# instalador systemd — pero en la práctica el cerebro estaba exponiendo /metrics y NADIE lo
# scrapeaba. Con eso, las 9 reglas de S4b, las de políticas de S10 y el dead-man's switch entero
# estaban INERTES: escritas, probadas, y sin evaluar. Es el mismo modo de fallo que persigue todo
# el track — algo que se ve cubierto y no lo está.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# POR QUÉ `network_mode: host`
#
# Prometheus tiene que llegar al cerebro por `127.0.0.1:7717` y a Alertmanager por
# `127.0.0.1:9093`. Dentro de una red de Docker, `127.0.0.1` es el CONTENEDOR: los scrapes
# fallarían con «connection refused» y el bloque `alerting:` no encontraría a nadie. Con red del
# host, las direcciones del archivo significan lo que dicen — el mismo `prometheus.yml` sirve para
# esta variante y para la de systemd, sin un segundo archivo que se vaya a la deriva.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# POR QUÉ EL 9099 Y NO EL 9090
#
# 9090 es el puerto por defecto de **Cockpit**, que viene instalado en muchos servidores Linux
# —incluido `musubi-server`— y lo ocupa. Prometheus arrancaría con «address already in use», o
# peor: alguien apuntaría el navegador al 9090, vería una UI, y creería que Prometheus anda.
# Se corre a 9099 y se documenta el motivo, en vez de dejar una colisión esperando.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# LOOPBACK A PROPÓSITO
#
# Ni Prometheus ni Alertmanager tienen autenticación. La API de Alertmanager puede SILENCIAR
# alertas sin credencial: exponerla al tailnet sería darle a cualquiera en la red la capacidad de
# apagar la vigilancia. Para ver las UIs desde otra máquina, túnel SSH:
#
#   ssh -N -L 9099:127.0.0.1:9099 -L 9093:127.0.0.1:9093 usuario@musubi-server
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# ROOTLESS POR DEFECTO, Y POR QUÉ IMPORTA
#
# `MUSUBI_PROM_DIR` sale del `.env` que escribe `preparar.sh`. Sin root apunta a
# `$HOME/musubi-prometheus`; con root, a `/etc/musubi-prometheus`. UN solo compose para las dos
# variantes: dos archivos casi iguales se separan en la primera corrección que alguien aplica a
# uno solo.
#
# La variante rootless no es una comodidad: en un host con SELinux en Enforcing evita de raíz el
# mapeo de UIDs y los permisos de `/etc`, y no pide contraseña en ningún paso. Es además el patrón
# que ya funciona en `musubi-server` (todo el stack de Supabase corre así).
#
# `:z` en cada montaje pide a Podman que reetiquete el archivo a `container_file_t`. Sin eso, con
# SELinux en Enforcing, el contenedor no puede leer su propia configuración — y el error no
# menciona SELinux por ningún lado. Sólo toca archivos que crea `preparar.sh`.
#
# `user: "0:0"` NO ES UN PRIVILEGIO ACÁ, Y SIN ÉL NO ARRANCA.
#
# Las dos imágenes corren como `nobody` (65534) por defecto. En Podman ROOTLESS ese UID cae en el
# espacio de *subuid* —o sea, NO es tu usuario— y entonces no puede leer un `musubi.token` en
# modo 0400 que te pertenece. El síntoma es desconcertante y no menciona permisos:
#
#     unable to read authorization credentials file
#
# Con `0:0`, el root del contenedor SE MAPEA a tu usuario del host: lee sus archivos y no gana
# ningún privilegio real (sigue siendo un proceso tuyo, sin root en la máquina). Bajarle los
# permisos al token en vez de esto sería cambiar un problema de mapeo por uno de secretos.
#
# En la variante con root, `0:0` es root de verdad — pero ahí los archivos también son de root y
# la lectura funciona por el mismo motivo.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# ARRANQUE
#
#   ./preparar.sh                 # sin sudo si vas rootless
#   podman compose up -d          # o docker compose up -d

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: musubi-prometheus
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      # 9090 es de Cockpit. Ver arriba.
      - --web.listen-address=127.0.0.1:9099
      # Necesario para `curl -X POST /-/reload` (el RUNBOOK lo usa al cambiar reglas).
      - --web.enable-lifecycle
    volumes:
      - ${MUSUBI_PROM_DIR}/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ${MUSUBI_PROM_DIR}/rules:/etc/prometheus/rules:ro,z
      - ${MUSUBI_PROM_DIR}/musubi.token:/etc/prometheus/musubi.token:ro,z
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: musubi-alertmanager
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ${MUSUBI_PROM_DIR}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      # Los secretos del canal y la URL del watchdog entran POR ARCHIVO, nunca por el yaml:
      # así rotarlos no toca la configuración ni pide reconstruir nada.
      - ${MUSUBI_PROM_DIR}/secretos:/etc/musubi:ro,z
      - alertmanager-data:/alertmanager

volumes:
  prometheus-data:
  alertmanager-data:

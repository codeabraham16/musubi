# Drop-in de musubi-agente.service — la excepción que el inventario de contenedores necesita.
#
# ════════════════════════════════════════════════════════════════════════════════════════════
# POR QUÉ EXISTE
#
# La unidad base dice, y el comentario está escrito ahí: «El agente sólo LEE /proc y habla con
# loopback. Nada de esto le hace falta». De ahí salen ProtectHome=read-only y
# ProtectSystem=strict, y era cierto — hasta que A42 le dio un trabajo nuevo: enumerar lo que
# corre en esta máquina, contenedores incluidos. Nadie volvió a mirar el blindaje.
#
# `podman ps` NO es una lectura. Medido con strace en este servidor, abre en modo escritura:
#
#   /home/musubi/.local/share/containers/storage/db.sql        (O_RDWR|O_CREAT)
#   …/storage.lock  …/userns.lock  …/networks/netavark.lock
#   …/overlay-images/images.lock   …/overlay-containers/containers.lock
#   /run/user/1000/containers/overlay-layers/mountpoints.lock
#   /run/user/1000/libpod/tmp/alive.lck
#
# Sin estas rutas, `podman ps` sale con código 1. El síntoma NO es «faltan los contenedores»:
# el agente no manda inventario ninguno, ni el de systemd, y es a propósito — el cerebro poda
# por ausencia, así que media lista no informa menos, afirma que la otra mitad dejó de existir.
#
# ════════════════════════════════════════════════════════════════════════════════════════════
# LO QUE ESTO CONCEDE, DICHO SIN ADORNO
#
# Con estas rutas escribibles el agente puede MANEJAR podman, no sólo listarlo. No existe una
# puerta de sólo-lectura: el socket de la API (/run/user/1000/podman/podman.sock) necesitaría
# una excepción más chica en la unidad pero concede lo MISMO o más —crear un contenedor con un
# bind-mount del host—, así que cambiar de puerta no compra seguridad, sólo código. Se queda el
# CLI, que ya está escrito y funciona igual en docker.
#
# El techo real sigue siendo el usuario: `musubi` ya es dueño del store y del socket. Esto no le
# da al agente ninguna capacidad que el usuario no tuviera; le saca el confinamiento de MONTAJE
# que lo separaba de ella. Si el agente deja de enumerar contenedores, esta excepción se borra.
#
# ════════════════════════════════════════════════════════════════════════════════════════════
# EL GUION EN LAS RUTAS DE /run NO ES COSMÉTICO
#
# /run/user/1000 lo crea logind y sobrevive gracias a `Linger=yes`. En un arranque, este unit
# puede llegar antes que user@1000.service — y un ReadWritePaths sobre una ruta que no existe
# hace FALLAR EL ARRANQUE de la unidad entera. Con el `-` la ruta es opcional: el agente arranca
# igual, y si no llegó a tiempo el inventario avisa solo (los servicios se ponen `fresco: false`
# y salta ServicioSinNoticias) en vez de dejar la máquina muda.

[Unit]
After=user@1000.service

[Service]
ReadWritePaths=/home/musubi/.local/share/containers
ReadWritePaths=-/run/user/1000/containers
ReadWritePaths=-/run/user/1000/libpod

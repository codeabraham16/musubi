# musubi-alerts.yml — reglas de alerta Prometheus para el cerebro central de Musubi (Track 18).
#
# Cierra el hueco que marcó la auditoría: /metrics exponía contadores ricos (rechazos de cuota/
# authz, outbox muerto, índice sin entrenar, staleness del backup) pero NADA disparaba sobre ellos
# — operabilidad reactiva, no 24/7. Estas reglas hacen PAGINABLES los eventos de mayor consecuencia.
#
# Instalación (Prometheus):
#   1. Copiá este archivo junto a prometheus.yml (o a /etc/prometheus/rules/).
#   2. En prometheus.yml:  rule_files: ["musubi-alerts.yml"]
#   3. Scrape del cerebro:  job_name: "musubi" → <tailnet-ip>:7717/metrics  (con el bearer si aplica)
#   4. Recargá Prometheus (SIGHUP o /-/reload). Ver deploy/RUNBOOK.md para qué hacer ante cada alerta.
#
# Los umbrales son un punto de partida sensato para un cerebro de equipo chico; ajustá a tu SLO.

groups:
  - name: musubi-brain
    rules:
      # --- Disponibilidad ---
      - alert: MusubiDown
        expr: up{job="musubi"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "El cerebro Musubi no responde al scrape (>5m)."
          runbook: "deploy/RUNBOOK.md#musubidown"
      # ── El empuje OTLP se vigila a sí mismo (S11 · A46) ───────────────────────────────────
      #
      # Las TRES reglas se APAGAN SOLAS cuando el empuje está apagado, y eso no es casualidad:
      # `musubi_push_failures_total` vale 0 con el empuje off, y `musubi_push_last_success_seconds`
      # NO EXISTE hasta el primer empuje aceptado. Así que un despliegue que nunca encendió el
      # empuje no recibe una sola alarma — que es la única forma de que estas reglas se puedan
      # instalar SIEMPRE sin enseñarle a nadie a ignorar el canal.
      - alert: MusubiPushOTLPFallando
        expr: rate(musubi_push_failures_total[15m]) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "El empuje OTLP de la flota no llega a destino."
          runbook: "deploy/RUNBOOK.md#musubipushotlpfallando"

      # El empuje SE MURIÓ después de haber funcionado. Distinto del de arriba: acá no hay errores
      # que contar porque puede que ni se esté intentando (el principal perdió su concesión
      # `metrics` en una recarga en caliente, y eso no cuenta como fallo — ver A50).
      - alert: MusubiPushOTLPMudo
        expr: musubi_push_last_success_seconds > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El empuje OTLP funcionó alguna vez y hace más de 10 minutos que no."
          runbook: "deploy/RUNBOOK.md#musubipushotlpmudo"

      # NUNCA funcionó: hay fallos y no hay un solo éxito. Es la firma exacta del Prometheus sin
      # `--web.enable-otlp-receiver` (404 en cada POST) y del token mal puesto (401). Se separa de
      # las otras dos porque el arreglo es completamente distinto: no se cayó nada, nunca anduvo.
      - alert: MusubiPushOTLPNuncaLlego
        expr: musubi_push_failures_total > 0 unless musubi_push_last_success_seconds
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "El empuje OTLP nunca llegó a destino ni una vez: revisá --web.enable-otlp-receiver y el token."
          runbook: "deploy/RUNBOOK.md#musubipushotlpnuncallego"

      - alert: MusubiOutboxDead
        expr: musubi_sync_outbox{state="dead"} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Hay filas del outbox de sync muertas (agotaron reintentos)."
          runbook: "deploy/RUNBOOK.md#musubioutboxdead"

      # --- Recall degradado: IVF sin entrenar con dataset grande (cae a full-scan) ---
      - alert: MusubiVectorIndexUntrained
        expr: musubi_vector_index_trained == 0 and musubi_embeddings_active > 10000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "El índice vectorial no está entrenado con >10k embeddings (recall = full-scan)."
          runbook: "deploy/RUNBOOK.md#musubivectorindexuntrained"

      # --- Seguridad/capacidad: rechazos de cuota sostenidos (principal desbocado o límite bajo) ---
      - alert: MusubiQuotaRejections
        expr: sum(rate(musubi_tool_rejections_total{reason="quota"}[5m])) > 0
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Un principal viene chocando la cuota por-minuto de forma sostenida."
          runbook: "deploy/RUNBOOK.md#musubiquotarejections"

      # --- Seguridad: rechazos de authz repetidos (probing / token revocado en uso) ---
      - alert: MusubiAuthzRejectionsSpike
        expr: sum(rate(musubi_tool_rejections_total{reason="authz"}[5m])) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Pico sostenido de rechazos de autorización (probing o credencial inválida en uso)."
          runbook: "deploy/RUNBOOK.md#musubiauthzrejectionsspike"

      # --- Salud de tools: tasa de error alta ---
      - alert: MusubiToolErrorRateHigh
        expr: |
          sum(rate(musubi_tool_calls_total{result="error"}[5m]))
            / clamp_min(sum(rate(musubi_tool_calls_total[5m])), 1) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Más del 20% de las tools/call fallan (sostenido 10m)."
          runbook: "deploy/RUNBOOK.md#musubitoolerrorratehigh"

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # LA FLOTA (track «Control de flota»)
  #
  # Todas estas reglas dependen de que el scrape tenga concesiones de flota en principals.yaml
  # (ver el encabezado de deploy/prometheus/prometheus.yml). Sin ellas no hay series y las
  # alertas no disparan NI FALLAN — que es la trampa silenciosa que cierra FlotaSinTelemetria.
  # ═══════════════════════════════════════════════════════════════════════════════════════════

  - name: musubi-watchdog
    rules:
      # SIEMPRE EN FIRING, A PROPÓSITO. Su valor no está en dispararse: está en DEJAR DE LLEGAR.
      #
      # Todas las reglas de arriba comparten un punto ciego: si Prometheus muere, si Alertmanager
      # muere, si el canal de notificación se cae, NINGUNA dispara — y el silencio se ve
      # exactamente igual que "todo bien". Esta regla convierte ese silencio en una señal.
      #
      # Alertmanager la rutea a un receptor `watchdog` (ver deploy/prometheus/alertmanager.yml)
      # que hace un ping periódico a un servicio externo. Ese servicio es el que grita cuando el
      # ping falta. Sin ese otro lado, esta regla no hace nada: es media alarma.
      - alert: MusubiSiempreViva
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Latido de la cadena de alertas. Si DEJA de llegar, lo roto es el sistema de alertas y todo el resto está ciego."
          runbook: "deploy/RUNBOOK.md#musubisiempreviva"

      # ────────────────────────────────────────────────────────────────────────────────────
      - alert: CadenaDeAlertasFallando
        # UN RECEPTOR QUE NO ENTREGA, MIENTRAS OTRO ENTREGA PERFECTO.
        #
        # Encontrado midiendo, no suponiendo: el receptor del dead-man's switch llevaba 32 horas
        # fallando cada 5 minutos —387 errores— con el mismo Alertmanager mandando por Telegram
        # sin un solo fallo. El error vivía en el log de un contenedor, que es donde las cosas
        # van a no ser vistas.
        #
        # `by(integration)` y NO por `reason`: el motivo es útil en el mensaje, no para agrupar —
        # un canal roto que rota entre `clientError` y `other` sería dos alertas distintas.
        expr: sum by(integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "La cadena de alertas no entrega por {{ $labels.integration }}"
          description: >-
            {{ $value | printf "%.0f" }} envíos fallidos en 15 minutos. Los OTROS canales pueden
            estar entregando bien: esta alerta llegó, así que al menos uno anda.
          runbook: "deploy/RUNBOOK.md#cadenadealertasfallando"

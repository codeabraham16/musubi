# prometheus.yml — scrape + evaluación de alertas para el cerebro central de Musubi.
#
# Lo instala deploy/prometheus/install-musubi-prometheus.sh (Prometheus como systemd nativo,
# al estilo de install-musubi-brain.sh). Prometheus corre EN EL MISMO host que el cerebro,
# así que scrapea 127.0.0.1:7717/metrics por loopback (no hace falta abrir el puerto).
#
# El endpoint /metrics EXIGE el mismo bearer token que el resto del cerebro
# (service.auth_token_env). Se pasa por `credentials_file` para que el secreto NUNCA viva en
# este archivo — mismo patrón "token por referencia" que el .mcp.json de los clientes.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# PARA VER LAS MÉTRICAS DE LA FLOTA (musubi_fleet_device_*) HACE FALTA UN PASO MÁS
#
# Desde el track «Control de flota», /metrics exporta también la telemetría de cada máquina —
# pero SÓLO las que la credencial del scrape puede ver. Y las capacidades de flota NO se derivan
# del rol: un token admin SIN concesiones explícitas no ve ni una máquina, a propósito (si no,
# el token de Prometheus sería una puerta trasera que sortea el eje de capacidades entero).
#
# Con el token legacy de arriba vas a ver las métricas del SERVIDOR y ninguna de la flota, y la
# propia salida de /metrics te lo dice en un comentario. Para verlas, dale a Prometheus su propio
# principal en .musubi/principals.yaml:
#
#   principals:
#     - name: prometheus
#       token_sha256: "<sha256 del token que pongas en credentials_file>"
#       role: reader
#       read: all                # ve todos los proyectos
#       fleet:
#         metrics: ["*"]         # ...y la telemetría de todas las máquinas
#
# Nada más: NO le des `exec` ni `screen`. Un scraper sólo necesita mirar, y una credencial que
# vive en un archivo de configuración de otro servicio es exactamente la que no querés que
# pueda ejecutar nada.
# ─────────────────────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: musubi-brain

# UN GLOB, NO UN ARCHIVO. Las reglas están repartidas en TRES archivos porque cada uno se instala
# bajo su propia condición (las de flota sólo si el cerebro expone `musubi_fleet_*`; la del backup
# off-host sólo si hay `BACKUP_REMOTE`). Con una ruta fija, `preparar.sh` copiaba el archivo de
# flota y Prometheus lo IGNORABA — con las 12 reglas en disco y ninguna evaluándose, que es peor
# que no haberlas instalado: se ven puestas.
rule_files:
  - /etc/prometheus/rules/*.yml

# LAS ALERTAS SALEN DE ACÁ HACIA ALGUIEN (S10 · A4). Hasta este track, este bloque era un
# comentario: las reglas se evaluaban y se veían en http://127.0.0.1:9099/alerts, y no notificaban
# a ningún lado. La configuración del destino está en alertmanager.yml, al lado de este archivo.
#
# Si todavía NO montaste Alertmanager, comentá este bloque: Prometheus arranca igual —los envíos
# fallan y quedan en su log— pero conviene que la ausencia sea una decisión y no un error de fondo.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # El cerebro Musubi. El job DEBE llamarse "musubi": la alerta MusubiDown mira up{job="musubi"}.
  - job_name: musubi
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/musubi.token
    static_configs:
      - targets: ["127.0.0.1:7717"]
        labels:
          instance: musubi-brain

  # Prometheus se scrapea a sí mismo: permite distinguir "el cerebro cayó" de "Prometheus cayó".
  #
  # EL 9099 NO ES UN CAPRICHO. 9090 es el puerto por defecto de **Cockpit**, que viene instalado
  # en muchos servidores Linux y lo ocupa. Los dos fallos que evita: Prometheus que no arranca por
  # «address already in use», y —peor— alguien que apunta el navegador al 9090, ve una UI, y cree
  # que Prometheus está andando cuando lo que contesta es Cockpit.
  #
  # Este target tiene que coincidir con `PROM_ADDR` del instalador systemd y con
  # `--web.listen-address` del compose. Lo custodia TestElPuertoDePrometheusEsElMismoEnTodosLados.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9099"]

# alertmanager.yml — el tramo que faltaba entre «la alerta se evalúa» y «alguien se entera».
#
# Cierra A4 del track «Control de flota». Hasta acá las reglas de deploy/musubi-alerts.yml se
# evaluaban y se veían en la UI de Prometheus (http://127.0.0.1:9099/alerts) y no notificaban a
# ningún lado. Una alerta que no llega a nadie no es una alerta: es una página web que nadie abre.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# EL SECRETO NO VIVE ACÁ. Los tokens/URLs de los canales entran por variables de entorno del
# servicio, igual que el bearer del cerebro (service.auth_token_env) y que el token de scrape
# (credentials_file). Este archivo se puede commitear; el EnvironmentFile no.
#
#   /etc/musubi/alertmanager.env   (chmod 600, dueño root)
#     TELEGRAM_BOT_TOKEN=123456:AA...
#     TELEGRAM_CHAT_ID=-1001234567890
#     SMTP_PASSWORD=...
#
# Instalación:
#   1. Copiá este archivo a /etc/alertmanager/alertmanager.yml
#   2. Escribí /etc/musubi/alertmanager.env con tus credenciales (chmod 600)
#   3. Descomentá el bloque `alerting:` de prometheus.yml y recargá Prometheus (/-/reload)
#   4. Ver deploy/RUNBOOK.md#alertmanager para el unit de systemd y la verificación
# ─────────────────────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m

route:
  # El agrupado es POR ALERTA Y POR MÁQUINA, no sólo por alerta: si 20 máquinas se quedan sin
  # disco a la vez, querés 20 avisos identificables y no uno que diga "DiscoPorLlenarse (20)".
  # Con `device` en el group_by, cada máquina tiene su hilo y se resuelve por separado.
  group_by: ['alertname', 'device']
  group_wait: 30s        # espera inicial: junta las que llegan juntas (un host que se cae entero)
  group_interval: 5m     # cada cuánto avisa de novedades DENTRO de un grupo ya notificado
  repeat_interval: 4h    # cada cuánto insiste con algo que sigue firing
  receiver: 'default'

  routes:
    # EL DEAD-MAN'S SWITCH VA PRIMERO Y SE VA POR SU PROPIO CAMINO.
    #
    # `MusubiSiempreViva` está SIEMPRE en firing, a propósito. Su valor no está en dispararse
    # —eso no informa nada— sino en DEJAR DE LLEGAR: si el watchdog calla, lo que se rompió es la
    # cadena de alertas (Prometheus caído, Alertmanager caído, la red del canal), y entonces el
    # silencio de todas las demás NO significa que todo esté bien.
    #
    # Es la misma idea que la alerta FlotaSinTelemetria, un nivel más arriba: ahí el riesgo era
    # que desaparecieran las series y las reglas dejaran de disparar; acá, que disparen y no
    # salgan. Los dos son fallos que se ven como calma.
    #
    # Del otro lado hace falta algo que espere este latido y grite si no llega: un Healthchecks.io,
    # un Dead Man's Snitch, o un cron propio. Sin ese otro lado, esta ruta no hace nada.
    # LA RUTA APUNTA A LA NADA MIENTRAS NO HAYA WATCHDOG EXTERNO, y eso NO es lo mismo que
    # borrarla ni que dejarla rota. Las tres opciones se probaron; sólo una es correcta.
    #
    # ROTA (apuntando a un `url_file` que no existe) fue el estado real durante 32 horas: 387
    # fallos de entrega, uno cada 5 minutos, en el log de un contenedor que nadie mira. Y con la
    # regla CadenaDeAlertasFallando puesta, eso pasa a ser una alerta que dispara y NO SE APAGA
    # NUNCA — y una alarma que no se apaga arreglando algo enseña a ignorar el canal entero.
    #
    # BORRADA fue peor, y se descubrió en el acto al intentarlo: `MusubiSiempreViva` está SIEMPRE
    # en firing a propósito, así que sin ruta propia cae al receptor por defecto y el latido pasa
    # a notificar por Telegram y al CRM cada 4 horas, para siempre. La misma alarma eterna, en el
    # canal que sí se lee.
    #
    # A LA NADA es lo correcto: la alerta SE SIGUE VIENDO en el Alertmanager —el latido existe y
    # se puede mirar— y no le llega a nadie. Es el patrón que usa kube-prometheus con su Watchdog.
    #
    # LO QUE SE PIERDE MIENTRAS TANTO, dicho: si se cae Prometheus, o el propio Alertmanager, o la
    # red del canal, NINGUNA alerta sale — y ese silencio se ve igual que la calma. Es el único
    # fallo que el sistema no puede detectar desde adentro, por definición.
    #
    # PARA REACTIVARLO: creá un check en Healthchecks.io (o Dead Man's Snitch, o un cron propio),
    # poné su URL de ping en `secretos/watchdog_url` con modo 600, y cambiá `null` por `watchdog`
    # abajo. Una palabra.
    - matchers:
        - alertname = "MusubiSiempreViva"
      receiver: 'null'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m   # corto: es un latido, no un aviso

    # Lo crítico insiste más seguido y no se agrupa con lo demás.
    - matchers:
        - severity = "critical"
      receiver: 'default'
      group_wait: 10s
      repeat_interval: 1h

    # `info` no despierta a nadie: se junta y se manda espaciado. Mezclarlo con lo crítico es la
    # forma más rápida de que se silencie el canal entero.
    - matchers:
        - severity = "info"
      receiver: 'default'
      group_interval: 30m
      repeat_interval: 24h

inhibit_rules:
  # Si la máquina está CAÍDA, no tiene sentido avisar además de su disco, su RAM y su temperatura:
  # son la misma noticia contada cinco veces, y las cuatro de más entierran a la primera.
  - source_matchers: [alertname = "MaquinaCaida"]
    target_matchers: [severity =~ "warning|info"]
    equal: ['device']

  # Lo mismo un nivel más arriba: si NO LLEGA NINGUNA métrica de flota, callar el resto de las
  # alertas de flota — todas están ciegas y lo único accionable es FlotaSinTelemetria.
  - source_matchers: [alertname = "FlotaSinTelemetria"]
    target_matchers: [severity =~ "warning|info"]

  # Y el clásico: lo crítico calla a lo warning de la misma alerta y máquina (DiscoCasiLleno
  # calla a DiscoPorLlenarse).
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname', 'device']

receivers:
  # ─── El receptor real ──────────────────────────────────────────────────────────────────────
  # Telegram porque no necesita un servidor de correo ni una cuenta de un SaaS, y porque el
  # teléfono ya está en el bolsillo. Cambialo por lo que uses; lo que NO cambia es que el secreto
  # entra por entorno.
  - name: 'default'
    telegram_configs:
      - bot_token_file: /etc/musubi/telegram_bot_token   # chmod 600, root:root
        # SIN chat_id VÁLIDO, ALERTMANAGER SE NIEGA A ARRANCAR (`missing chat_id on telegram_config`).
        # Es el comportamiento correcto y conviene no "arreglarlo": un canal a medio configurar que
        # arranca y se traga las alertas es peor que uno que no arranca y lo grita en el log.
        # Lo sacás con /start a tu bot y luego getUpdates, o con @userinfobot.
        # `preparar.sh` sustituye este 0 por el contenido de secretos/telegram_chat_id.
        # NO va escrito acá: Alertmanager no soporta `chat_id_file`, así que el único modo de que
        # un identificador personal no termine versionado en el repo es sustituirlo al instalar.
        chat_id: 0
        parse_mode: ''
        # ─── EL MENSAJE ────────────────────────────────────────────────────────────────────
        #
        # LO PRIMERO QUE TIENE QUE DECIR ES SI ALGO EMPEZÓ O TERMINÓ, y la versión anterior no lo
        # decía en ningún lado. `telegram_configs` manda las resoluciones por default, así que un
        # aviso de «se arregló» llegaba BYTE POR BYTE IDÉNTICO a uno de «se rompió». Con eso, el
        # canal no se puede leer: cada mensaje obliga a ir a mirar aunque sea una buena noticia.
        #
        # LO SEGUNDO ES NO REPETIR LO QUE NO CAMBIA. El agrupado junta por (alerta × máquina), y
        # la plantilla vieja hacía `range .Alerts` imprimiendo la cabecera entera por cada una:
        # cuatro servicios caídos eran cuatro bloques donde sólo variaba una línea. Con dieciséis
        # es un muro que nadie lee. Ahora la cabecera va UNA vez y abajo va la lista de lo que
        # varía — el servicio, o la política, o el resumen si no hay nada más específico.
        #
        # LA HORA VA EN LA ZONA DEL SERVIDOR (`.Local`), no en UTC: quien lee esto a las tres de
        # la mañana no debería tener que restar husos.
        #
        # `severidad mixta` NO ES COSMÉTICO: si un grupo junta alertas de severidad distinta,
        # `CommonLabels.severity` no existe y el template imprime `<no value>`. Se descubrió al
        # renderizar la plantilla con datos de verdad, que es algo que nunca se había hecho.
        #
        # SIGUE EN TEXTO PLANO A PROPÓSITO. Con `parse_mode: HTML` un `&` o un `<` en cualquier
        # resumen rompe el parseo y Telegram RECHAZA el mensaje entero: la alerta no llega. Un
        # formato más lindo no vale una alerta perdida.
        message: |
          {{ if eq .Status "firing" }}🔴 EMPIEZA{{ else }}✅ SE RESOLVIÓ{{ end }} · {{ if .CommonLabels.severity }}{{ .CommonLabels.severity }}{{ else }}severidad mixta{{ end }}{{ if gt (len .Alerts) 1 }} · {{ len .Alerts }} casos{{ end }}
          {{ .GroupLabels.alertname }}{{ if .GroupLabels.device }} — {{ .GroupLabels.device }}{{ end }}
          {{ if eq (len .Alerts) 1 }}{{ with index .Alerts 0 }}
          {{ .Annotations.summary }}
          {{ if eq $.Status "firing" }}desde las {{ .StartsAt.Local.Format "15:04" }}{{ else }}duró {{ .EndsAt.Sub .StartsAt }}{{ end }}{{ if .Annotations.runbook }}
          → {{ .Annotations.runbook }}{{ end }}{{ end }}{{ else }}
          {{ range .Alerts }}• {{ if .Labels.service }}{{ .Labels.service }}{{ else if .Labels.policy }}{{ .Labels.policy }}{{ else }}{{ .Annotations.summary }}{{ end }}
          {{ end }}{{ with index .Alerts 0 }}{{ if eq $.Status "firing" }}desde las {{ .StartsAt.Local.Format "15:04" }}{{ else }}duró {{ .EndsAt.Sub .StartsAt }}{{ end }}{{ if .Annotations.runbook }}
          → {{ .Annotations.runbook }}{{ end }}{{ end }}{{ end }}
    # ─── SEGUNDO CANAL: EL CRM ────────────────────────────────────────────────────────────
    # Segundo canal para lo mismo que va a Telegram. Telegram avisa; el CRM deja HISTORIA
    # consultable: qué alertó, sobre qué máquina, cuándo empezó y cuándo se resolvió.
    #
    # Va contra `POST /rest/v1/rpc/recibir_alerta` de Supabase. PostgREST mapea las claves de primer
    # nivel del JSON de Alertmanager a los argumentos de esa función, así que el cuerpo entra tal
    # cual — sin adaptador. Ver deploy/crm/alertas.sql.
    #
    # LA CLAVE ENTRA POR ARCHIVO, y NO por query string: en un `/rpc/`, PostgREST interpreta los
    # parámetros de la URL como ARGUMENTOS de la función, así que un `?apikey=…` da HTTP 400
    # (medido). Kong quiere el header `apikey` y PostgREST el `Authorization`, y los dos salen del
    # mismo archivo — rotar la clave es reemplazar un archivo, sin tocar esta configuración.
    #
    # `send_resolved: true` a propósito, al revés que el watchdog: en el CRM interesa cerrar el par
    # firing/resolved para poder preguntar "qué está activo AHORA" (ver la vista alertas_activas).
    webhook_configs:
      - url_file: /etc/musubi/crm_alertas_url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/musubi/crm_anon_key
          http_headers:
            apikey:
              files: [/etc/musubi/crm_anon_key]


  # ─── El latido ─────────────────────────────────────────────────────────────────────────────
  # Un GET periódico a un servicio externo que grita si deja de recibirlo. La URL es un secreto
  # (quien la tenga puede silenciar el watchdog), así que también entra por archivo.
  #
  # Con url_file, Alertmanager relee el archivo en cada envío: rotar la URL no pide reinicio.
  # EL RECEPTOR QUE NO MANDA A NINGÚN LADO. Existe para que una alerta pueda estar VISIBLE sin
  # notificar, que no es lo mismo que no tener la alerta. Sin configs, Alertmanager la descarta a
  # propósito, y el latido sigue apareciendo en su interfaz para quien lo quiera mirar.
  - name: 'null'
  - name: 'watchdog'
    webhook_configs:
      - url_file: /etc/musubi/watchdog_url   # p. ej. https://hc-ping.com/<uuid>
        send_resolved: false

name: Bench (scale)

# Benchmarks a ESCALA (n=100000), Track 16 F3. Sembrar 100k observaciones tarda minutos, así que
# NO corre en cada push (eso lo hace el job `bench-guard` de ci.yml a n=1k/10k). Corre semanal y
# a demanda: valida a 100k lo que el ratio 10k/1k no descartaría — una regresión de memoria que
# sólo muerde con corpus grande (justo la clase que la auditoría marcó en Consolidate y en el IVF
# ">10k jamás benchmarkeado"). Es un CANARIO de escala, no un gate de PR: avisa por la corrida
# fallida sin bloquear el desarrollo.
on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  bench-scale:
    runs-on: ubuntu-latest
    # MEDIDO ACÁ, NO ESTIMADO. La corrida 34387150955 (2026-09-09, la primera verde en la
    # historia de este workflow) tardó **10 min 32 s el job entero**, los dos benchmarks a 100k
    # incluidos. Vale la pena dejarlo escrito porque contradice lo que yo había supuesto: la
    # primera versión de este comentario decía «un runner estándar de GitHub es más lento» y
    # estimaba 21 min a partir del tiempo local (i7-7700K: 337 s el paso vectorial, 941 s el de
    # Maintain). El runner es MÁS RÁPIDO, no más lento. La suposición estaba de más en un archivo
    # cuyo defecto era, justamente, creerle a un rótulo que nadie había medido.
    #
    # El techo queda igual de holgado igual, porque su trabajo no es ajustarse al caso normal
    # sino ACOTAR el anormal: sin él, un cuelgue se come las 6 h de default sin decir nada.
    #
    # 120 y no 90: los `-timeout` de los dos pasos suman 30m + 60m = 90 EXACTOS, así que un
    # techo de 90 no dejaba ni un segundo para el checkout, el setup-go y la compilación. Si
    # los dos pasos se acercaran a su límite, el job se cortaría ANTES de que el timeout de Go
    # imprima nada — y volveríamos a un rojo sin salida, que es el defecto que este archivo
    # acaba de sacarse de encima. El techo del job tiene que ser MAYOR que la suma, no igual.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'

      - name: Vector search sublinearity @ 100k (IVF)
        # Con el IVF entrenado, el costo de búsqueda crece ~nprobe·√n. Para un salto 10x de n
        # (10k→100k) la memoria por búsqueda debería crecer ~√10 ≈ 3.2x; el umbral 6 atrapa una
        # regresión IVF→full-scan (que lo llevaría a ~lineal, ~10x) sin falsos positivos. Mismo
        # criterio que bench-guard, un tramo más arriba en la escala.
        env:
          MUSUBI_BENCH_SCALE: '1'
        run: |
          # LA SALIDA SE IMPRIME ANTES DE JUZGARLA, y no al revés. La forma anterior era
          # `out=$(go test …)` seguida de `echo "$out"`: con `bash -e`, si el benchmark falla el
          # step muere EN la asignación y el echo nunca corre. Este job tuvo 8 corridas en toda su
          # historia y las 8 fueron rojas —nunca estuvo verde— mostrando sólo el script y ninguna
          # salida. Es decir: la guarda nació sin poder informar. La evidencia se perdía
          # justo cuando hacía falta, y por eso costó siete semanas ver que no era una regresión
          # de escala sino un SQLITE_BUSY sembrando. `tee` la imprime primero; PIPESTATUS conserva
          # el código real de `go test`, que el pipe se comería.
          set +e
          go test -run=NONE -bench='BenchmarkSearchVector' -benchmem -benchtime=1x -timeout=30m ./internal/memory/ 2>&1 | tee bench-vector.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: el benchmark salió $rc — NO llegó a medir. Lo de arriba es el motivo, no una regresión de escala."
            exit 1
          fi
          out=$(cat bench-vector.txt)
          # El ancla va al CAMPO COMPLETO, no a un substring: Go escribe el sufijo `-N` con el
          # GOMAXPROCS del runner y lo OMITE cuando vale 1, así que `/n=10000-/` no matchearía
          # nada en una máquina de un solo core y el canario moriría diciendo «no se pudo medir».
          b10=$(echo "$out" | awk '$1 ~ /^BenchmarkSearchVector\/n=10000(-[0-9]+)?$/ {for(i=1;i<=NF;i++) if($i=="B/op") print $(i-1)}')
          b100=$(echo "$out" | awk '$1 ~ /^BenchmarkSearchVector\/n=100000(-[0-9]+)?$/ {for(i=1;i<=NF;i++) if($i=="B/op") print $(i-1)}')
          echo "B/op n=10000:  ${b10:-<vacío>}"
          echo "B/op n=100000: ${b100:-<vacío>}"
          awk -v a="$b10" -v b="$b100" 'BEGIN {
            if (a+0 == 0 || b+0 == 0) { print "ERROR: no se pudo medir B/op de SearchVector a escala"; exit 1 }
            r = (b+0)/(a+0)
            printf "ratio B/op(100k)/B/op(10k) = %.1fx (umbral 6)\n", r
            if (r > 6.0) { print "ERROR: la búsqueda vectorial dejó de escalar sublinealmente a 100k (¿IVF caído a full-scan?)"; exit 1 }
            print "OK: la búsqueda vectorial escala sublinealmente a 100k (IVF)"
          }'

      - name: Maintain complexity @ 100k (memoria sub-cuadrática)
        # `!cancelled()` y no el `success()` implícito: son DOS canarios independientes, y sin
        # esto un fallo del paso vectorial saltea éste por completo. O sea que la corrida perdía
        # el 100% de la señal del segundo invariante sin decir que la había perdido — el mismo
        # patrón de «la evidencia se pierde justo cuando hace falta» que tuvo a este job ocho
        # corridas mudo. Se ejecuta igual y el job igual queda rojo por el paso que falló.
        if: ${{ !cancelled() }}
        # Consolidate es el paso caro; su fix denso (T7.1) lo dejó ~lineal en memoria. Para un
        # salto 10x de n, lineal ≈ 10x y cuadrático ≈ 100x; el umbral 20 atrapa el regreso a
        # cuadrático a escala sin marcar el crecimiento lineal esperado.
        env:
          MUSUBI_BENCH_SCALE: '1'
        run: |
          # Misma corrección que el paso de arriba: la salida se imprime ANTES de juzgarla.
          #
          # Y `-timeout=60m`, no 30m. En local tarda 941 s (15,7 min) y 30m dejaba el margen
          # dentro del ruido de un runner compartido. Medido después en CI (corrida 34387150955)
          # el job entero da 10 min 32 s, o sea que 30m habrían alcanzado — pero el margen se
          # queda: no cuesta nada cuando el paso corre bien, y un timeout de Go acá volvería a
          # dejar el canario en rojo permanente, que es justo el modo de falla que este arreglo
          # vino a sacar. (No sería un falso positivo silencioso: el chequeo de `rc` de abajo
          # dice que NO llegó a medir.)
          set +e
          go test -run=NONE -bench='BenchmarkMaintain' -benchmem -benchtime=1x -timeout=60m ./internal/memory/ 2>&1 | tee bench-maintain.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: el benchmark salió $rc — NO llegó a medir. Lo de arriba es el motivo, no una regresión de escala."
            exit 1
          fi
          out=$(cat bench-maintain.txt)
          b10=$(echo "$out" | awk '$1 ~ /^BenchmarkMaintain\/n=10000(-[0-9]+)?$/ {for(i=1;i<=NF;i++) if($i=="B/op") print $(i-1)}')
          b100=$(echo "$out" | awk '$1 ~ /^BenchmarkMaintain\/n=100000(-[0-9]+)?$/ {for(i=1;i<=NF;i++) if($i=="B/op") print $(i-1)}')
          echo "B/op n=10000:  ${b10:-<vacío>}"
          echo "B/op n=100000: ${b100:-<vacío>}"
          awk -v a="$b10" -v b="$b100" 'BEGIN {
            if (a+0 == 0 || b+0 == 0) { print "ERROR: no se pudo medir B/op de Maintain a escala"; exit 1 }
            r = (b+0)/(a+0)
            printf "ratio B/op(100k)/B/op(10k) = %.1fx (umbral 20)\n", r
            if (r > 20.0) { print "ERROR: Maintain volvió a escalar cuadráticamente en memoria a 100k"; exit 1 }
            print "OK: Maintain escala sub-cuadráticamente en memoria a 100k"
          }'
